<!--
  ansicht_start – Startseite / Übersicht

  Zweck:      Begrüßung, Kennzahlen und Hinweise je Rolle.
  Datenquelle: App.daten (Snapshot) und api…-Funktionen (siehe docs/ENTWICKLUNG.md).
  Wer darf:   alle Benutzer – serverseitig erzwungen; App.darf blendet nur aus.
  Besonderheiten: PLATZHALTER – wird in der laufenden Ausbaustufe gefüllt.
-->
<script>
(function () {
  'use strict';
  var A = window.App;
  // Vorläufige Startseite; das Dashboard mit Kennzahlen folgt.
  A.registriere('start', {
    titel: 'Start', aktion: null, reihenfolge: 1,
    zeichne: function (ziel) {
      var b = A.startdaten.benutzer || {};
      ziel.appendChild(A.el('h1', 'Willkommen' + (b.name ? ', ' + b.name : '')));
      ziel.appendChild(A.el('p', 'Angemeldet als ' + (b.email || '') + ' – Rolle: ' + ((b.rollen || []).join(', ') || '–'), { className: 'karte' }));
    }
  });
})();
</script>
