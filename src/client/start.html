<!--
  start – startet die Oberfläche, nachdem kern und alle Ansichten geladen sind (letztes include in index).
  Zweck: App.starte() aufrufen und danach selten sofort gebrauchte Snapshot-Bereiche im Hintergrund vorladen, damit
         Mitglied-Details, Datenschutz und Schriftverkehr beim ersten Öffnen ohne Wartezeit erscheinen.
  Datenquelle/Rechte: siehe client/kern – der Server liefert je Bereich nur, was die Rolle sehen darf.
  Besonderheit: Vorladen still (ohne Fehlermeldung) und erst kurz nach dem Start, damit es den Start nicht bremst;
         „finanzen“ lädt die Startseite für Finanzrollen ohnehin sofort.
-->
<script>
(function () {
  var A = window.App, vorgeladen = false;
  A.daten.beobachte(function () {
    if (vorgeladen || !A.startdaten) return;
    vorgeladen = true;
    var bereiche = ['historie'];
    if (A.sieht('finanz')) bereiche.push('korrespondenz');
    setTimeout(function naechster() {
      var b = bereiche.shift();
      if (!b) return;
      A.daten.lade(b, A.still).catch(function () { /* still – die Ansicht lädt bei Bedarf erneut */ }).then(naechster);
    }, 1500);
  });
  A.starte();
})();
</script>
