<!--
  ansicht_verwaltung – Verwaltung: Benutzer & Rechte, Einstellungen, Stammdaten, Datenqualität, System.

  Zweck:      Reiter „Benutzer“ (Zugänge anlegen/ändern/deaktivieren, Rechte je Rolle ansehen, Warnliste „Zugang ohne
              passendes Amt“), „Einstellungen“ (Werte aus _Konfig mit Prüfung, gegliedert nach Bereichen – KONFIG_GRUPPEN –,
              Suche über alle Bereiche, Markierung offener Punkte), „Stammdaten“ (Abteilungen,
              Funktionsarten, Beitragsarten, Nachweisarten, Ehrungsstufen, Aufbewahrungsfristen – nach Bereichen gegliedert
              (STAMM_GRUPPEN), je Art in Unterabschnitte, Dialog mit Feldgruppen), „Datenqualität“
              (Prüfregeln über den ganzen Bestand) und „System“ (Cache, Zeilenzahlen, Snapshot neu aufbauen).
  Datenquelle: apiVerwaltung…-Funktionen (src/api/Verwaltung.js); Abteilungen und Personen für Auswahlfelder aus App.daten.
  Wer darf:   benutzer_verwalten, konfig_aendern, stammdaten_bearbeiten (Vorstand, Mitgliederverwalter) – je Reiter;
              serverseitig erzwungen.
  Besonderheiten:
    - Die Rechte je Rolle werden nur angezeigt: Sie stehen bewusst im Code (src/lib/rechte.js, V5) und werden über
      Git geändert, nicht über eine Tabellenzelle.
    - Man kann sich nicht selbst die letzte Verwaltungsrolle entziehen (Server prüft).
    - Stammdaten werden nicht gelöscht, sondern auf „aktiv = nein“ gesetzt.
-->
<style>

<script>
(function () {
  'use strict';
  var A = window.App;

  // ================================================================== Hilfen

  var TITEL = {
    online_schluessel: 'Schlüssel im Online-Formular', als_gemeinschaft: 'Als Gemeinschaft (Familie/Ehepaar)',
    betrag_vorher: 'Betrag vor „gültig ab“', gueltig_ab: 'Gültig ab', blsv_sportart: 'BLSV-Sportart', fz_pflichtig: 'Führungszeugnis nötig',
    ehrungsfaehig: 'Zählt für Funktionsjubiläum', wiedervorlage_monate: 'Wiedervorlage nach Monaten', max_alter_zeugnis_monate: 'Zeugnis höchstens Monate alt',
    loeschfrist_monate: 'Löschfrist nach Tätigkeitsende (Monate)', betrifft_tab: 'Betrifft', dauer_monate: 'Dauer (Monate)', schwelle: 'Ab Jahren',
    max_erwachsene: 'Höchstens Erwachsene', max_kinder: 'Höchstens Kinder', kinder_bis_alter: 'Kinder bis Alter (einschließlich)',
    ausbildung_bis_alter: 'Mit Ausbildung bis Alter (einschließlich)', alter_von: 'Alter von', alter_bis: 'Alter bis (einschließlich)'
  };
  /** Erklärungen in den Stammdaten-Formularen je Tab und Feld. */
  var HILFE = {
    Beitragsart: {
      als_gemeinschaft: { hilfe: 'Leer = Einzelbeitrag je Person. Familie/Ehepaar: Der Betrag gilt einmal für alle (Familien-/Ehegattenbeitrag); dann gelten die Regeln darunter.' },
      max_erwachsene: { hilfe: 'Nur für Familie/Ehepaar: z. B. 2. Leer = unbegrenzt.' },
      max_kinder: { hilfe: 'Nur für Familie/Ehepaar: leer = beliebig viele, 0 = keine Kinder (Ehegattenbeitrag).' },
      kinder_bis_alter: { hilfe: 'Nur für Familie/Ehepaar: 17 heißt bis zum 18. Geburtstag. Leer = Einstellung familie_kinder_bis_alter.' },
      ausbildung_bis_alter: { hilfe: 'Nur für Familie/Ehepaar: mit Schule/Studium/Ausbildung (voraussichtliches Ende am Mitglied) höchstens bis zu diesem Alter. Leer = keine Verlängerung.' },
      online_schluessel: { hilfe: 'Tarif-Schlüssel im Online-Aufnahmeantrag der Homepage, z. B. „familienbeitrag“ (mehrere durch Komma).' }
    }
  };

  function titelVon(name) {
    if (TITEL[name]) return TITEL[name];
    var t = String(name).replace(/_id$/, '').replace(/_/g, ' ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function abteilungsListe() {
    return A.daten.liste('abteilungen').map(function (a) { return { wert: a.abteilung_id, text: a.bezeichnung + (a.aktiv === false ? ' (ruht)' : '') }; });
  }

  /** Formularfelder aus dem Feldkatalog; FK-Felder auf Abteilung/Funktionsart werden zu Auswahllisten. */
  function felderAus(tab, namen, extra) {
    var katalog = ((A.startdaten && A.startdaten.felder) || {})[tab] || [];
    extra = extra || {};
    return namen.map(function (n) {
      var s = katalog.filter(function (x) { return x.name === n; })[0];
      if (!s) return null;
      var typ = { Text: 'text', Langtext: 'langtext', Datum: 'datum', Zeitpunkt: 'datum', Auswahl: 'auswahl', 'ja/nein': 'janein',
        Ganzzahl: 'zahl', FK: 'zahl', Dezimal: 'betrag' }[s.typ] || 'text';
      var f = { name: n, titel: titelVon(n), typ: typ, pflicht: s.pflicht === 'ja' };
      if (typ === 'auswahl') f.liste = ((A.startdaten && A.startdaten.listen) || {})[s.liste] || [];
      if (n === 'abteilung_id') { f.typ = 'auswahl'; f.liste = abteilungsListe(); }
      Object.keys(extra[n] || {}).forEach(function (k) { f[k] = extra[n][k]; });
      return f;
    }).filter(Boolean);
  }

  /** Alle bearbeitbaren Fachfelder eines Tabs (ohne ID, version, geaendert_*, auto). */
  function fachfelder(tab) {
    var katalog = ((A.startdaten && A.startdaten.felder) || {})[tab] || [];
    return katalog.filter(function (s) {
      return s.pflicht !== 'PK' && s.pflicht !== 'auto' && ['version', 'geaendert_am', 'geaendert_von'].indexOf(s.name) < 0;
    }).map(function (s) { return s.name; });
  }

  function personWahl(beiWahl, beschriftung, startText) {
    var feld = A.el('input', null, { type: 'search', placeholder: 'Name oder Mitgliedsnummer …', autocomplete: 'off', value: startText || '' });
    feld.setAttribute('aria-label', beschriftung);
    var ul = A.el('ul', null, { hidden: true });
    feld.addEventListener('input', A.verzoegert(function () {
      var t = A.falte(feld.value).trim();
      A.leere(ul);
      if (!t) { ul.hidden = true; beiWahl(null); return; }
      var l = A.daten.liste('mitglieder').filter(function (m) {
        return String(m.mitgliedsnummer || '') === feld.value.trim() || A.falte([m.nachname, m.vorname].join(' ')).indexOf(t) >= 0;
      }).slice(0, 8);
      ul.hidden = !l.length;
      l.forEach(function (m) {
        var b = A.el('button', A.name(m) + ' · ' + (m.mitgliedsnummer || ''), { type: 'button' });
        b.addEventListener('click', function () { ul.hidden = true; feld.value = A.name(m); beiWahl(m); });
        ul.appendChild(A.el('li', null, null, [b]));
      });
    }, 120));
    return A.el('div', null, { className: 'vw-person' }, [A.el('label', beschriftung), feld, ul]);
  }

  function reiterLeiste(reiter, aktiv, beiWahl) {
    var leiste = A.el('div', null, { className: 'reiter' });
    leiste.setAttribute('role', 'tablist');
    reiter.forEach(function (r) {
      var b = A.el('button', r.titel, { type: 'button' });
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', r.schluessel === aktiv ? 'true' : 'false');
      b.addEventListener('click', function () { beiWahl(r.schluessel); });
      leiste.appendChild(b);
    });
    return leiste;
  }

  function laedt(ziel) { var p = A.el('p', 'Lädt …', { className: 'laedt' }); ziel.appendChild(p); return p; }
  function fehlerText(ziel, text, nochmal) { A.leere(ziel); A.ladefehler(ziel, text, nochmal); }

  /** Formular im Dialog speichern; ruft api mit (…args, werte) und zeigt Feldfehler. */
  function speicherDialog(titel, form, api, args, fertig, zusatzVorher) {
    var inhalt = A.el('div', null, null, [zusatzVorher || null, form.element]);
    A.dialog(titel, inhalt, [
      { text: 'Abbrechen' },
      { text: 'Speichern', art: ' ', aktion: function (schliessen) {
        return A.rufe.apply(null, [api].concat(args).concat([form.werte(), A.still])).then(function (antwort) {
          A.daten.uebernehme(antwort);
          schliessen();
          A.meldung((antwort && antwort.hinweis) ? 'Gespeichert. ' + antwort.hinweis : 'Gespeichert.', antwort && antwort.hinweis ? 'hinweis' : 'ok');
          fertig(antwort);
        }, function (err) {
          if (err.felder) form.setzeFehler(err.felder);
          else if (err.art === 'konflikt') A.meldung('Inzwischen von jemand anderem geändert – bitte neu öffnen.', 'fehler');
          else A.fehler(err);
        });
      } }
    ]);
  }

  // ================================================================== Benutzer

  function benutzerDialog(b, daten, fertig) {
    var person = b && b.mitglied_id ? A.daten.hole('mitglieder', b.mitglied_id) : null;
    var gewaehlt = b ? b.mitglied_id || null : null;
    var felder = felderAus('Benutzer', ['email', 'name', 'rolle', 'abteilung_id', 'aktiv', 'bemerkung'], {
      email: { pflicht: true, typ: 'email', hilfe: 'Google-Konto der Vereinsdomain @' + daten.eigene_domain },
      rolle: { pflicht: true, liste: daten.rollen },
      abteilung_id: { hilfe: 'Nur bei Abteilungsleitern: welche Abteilung sie sehen.' }
    });
    var form = A.formular(felder, b || { aktiv: true });
    var wahl = personWahl(function (m) { gewaehlt = m ? m.mitglied_id : null; }, 'Person (für die Prüfung „Zugang ohne Amt“)', person ? A.name(person) : '');
    var formMitPerson = {
      element: form.element, setzeFehler: form.setzeFehler,
      werte: function () { var w = form.werte(); w.mitglied_id = gewaehlt; return w; }
    };
    form.element.appendChild(wahl);
    speicherDialog(b ? 'Zugang bearbeiten' : 'Zugang anlegen', formMitPerson, 'apiVerwaltungBenutzerSpeichern',
      [b ? b.benutzer_id : null, b ? b.version : null], fertig);
  }

  function reiterBenutzer(ziel) {
    var neu = function () { A.leere(ziel); reiterBenutzer(ziel); };
    var l = laedt(ziel);
    A.rufe('apiVerwaltungBenutzer').then(function (d) {
      l.remove();
      ziel.appendChild(A.abschnitt('Zugänge', [A.knopf('Zugang anlegen', function () { benutzerDialog(null, d, neu); })]));
      d.warnungen.forEach(function (w) {
        ziel.appendChild(A.el('div', w.email + ' (' + w.rolle + (w.person ? ', ' + w.person : '') + '): ' + w.meldung, { className: 'vw-warnung' }));
      });
      var abt = {};
      A.daten.liste('abteilungen').forEach(function (a) { abt[a.abteilung_id] = a.bezeichnung; });
      ziel.appendChild(A.tabelle([
        { feld: 'email', titel: 'Google-Konto' },
        { feld: 'name', titel: 'Name' },
        { feld: 'rolle', titel: 'Rolle' },
        { feld: 'abteilung_id', titel: 'Abteilung', wert: function (b) { return b.abteilung_id ? abt[b.abteilung_id] || b.abteilung_id : '–'; } },
        { feld: 'aktiv', titel: 'Status', wert: function (b) { return b.aktiv === true ? A.ampel('gruen', 'aktiv') : A.ampel('grau', 'deaktiviert'); } }
      ], d.benutzer, { sortiere: 'email', beiKlick: function (b) { benutzerDialog(b, d, neu); } }));
      ziel.appendChild(A.el('p', 'Zugang entziehen = „aktiv: nein“ setzen (nicht löschen). Wer zwei Rollen hat, bekommt zwei Zeilen.', { className: 'leise' }));

      ziel.appendChild(A.el('h2', 'Rechte je Rolle'));
      ziel.appendChild(A.el('p', 'Welche Rolle was sehen und ändern darf, ist fest im Programm hinterlegt und wird nur über eine geprüfte Programmänderung angepasst. Hier vergeben Sie nur, wer welche Rolle hat.', { className: 'leise' }));
      ziel.appendChild(A.tabelle([
        { feld: 'rolle', titel: 'Rolle' },
        { feld: 'zeilen', titel: 'sieht Personen', wert: function (r) { return { alle: 'alle', abteilung: 'eigene Abteilung', jugend: 'Jugend + Nachweispflichtige' }[r.zeilen] || r.zeilen; } },
        { feld: 'sicht', titel: 'Datenarten', wert: function (r) { return r.sicht.join(', '); } },
        { feld: 'aktionen', titel: 'darf', wert: function (r) { return r.aktionen.length + ' Aktionen: ' + r.aktionen.join(', '); } }
      ], Object.keys(d.matrix).map(function (k) { var m = d.matrix[k]; return { rolle: k, zeilen: m.zeilen, sicht: m.sicht, aktionen: m.aktionen }; }), { block: 10 }));
    }).catch(function () { fehlerText(ziel, 'Die Zugänge konnten nicht geladen werden.', neu); });
  }

  // ================================================================== Einstellungen

  /**
   * Gliederung der Einstellungen (_Konfig) in Bereiche und Unterabschnitte. Schlüssel, die hier fehlen (neu im
   * Setup ergänzt), landen in „Weitere“ – nichts geht verloren. Reihenfolge = Reihenfolge der Anzeige.
   */
  var KONFIG_GRUPPEN = [
    { id: 'verein', titel: 'Verein', text: 'Name, Anschrift und Links – erscheinen in Schreiben, SEPA-Datei und Fußzeile.', teile: [
      { titel: 'Name und Anschrift', schluessel: ['verein_name', 'verein_strasse', 'verein_hausnummer', 'verein_plz', 'verein_ort', 'verein_land'] },
      { titel: 'Links in der Fußzeile', schluessel: ['impressum_url', 'datenschutz_url'] }
    ] },
    { id: 'beitraege', titel: 'Beiträge', text: 'Beitragsjahr, anteilige Beiträge, Gebühren und Tarifwechsel.', teile: [
      { titel: 'Beitragsjahr und Berechnung', schluessel: ['beitragsjahr', 'beitrag_anteilig', 'ruecklastschrift_gebuehr', 'rueckfrage_wiedervorlage_tage'] },
      { titel: 'Tarifwechsel nach Alter', schluessel: ['tarifwechsel_automatisch', 'tarifwechsel_stichtag'] }
    ] },
    { id: 'familie', titel: 'Familienbeitrag', text: 'Altersgrenzen und Stichtage für Familien- und Ehegattenbeitrag. Die Beträge stehen unter Stammdaten.', teile: [
      { titel: 'Altersgrenzen', schluessel: ['familie_kinder_bis_alter', 'familie_ausbildung_bis_alter'] },
      { titel: 'Umstellung und Nachweise', schluessel: ['familie_umstellung_stichtag', 'ausbildungsnachweis_vorlauf_monate'] }
    ] },
    { id: 'sepa', titel: 'SEPA-Lastschrift', text: 'Angaben für die Lastschriftdatei der Bank.', teile: [
      { titel: 'Gläubiger und Vereinskonto', schluessel: ['verein_glaeubiger_id', 'verein_iban', 'verein_bic'] },
      { titel: 'Einzug', schluessel: ['sepa_format', 'sepa_faelligkeit', 'sepa_vier_augen', 'mandat_verfall_monate'] }
    ] },
    { id: 'mitglieder', titel: 'Mitglieder', text: 'Mitgliedsnummern, Altersgrenze Jugend und Stichtag der Jahresstatistik.', teile: [
      { titel: 'Mitgliedsnummern', schluessel: ['mitgliedsnummer_naechste', 'mitgliedsnummer_wiederverwendung'] },
      { titel: 'Jugend und Statistik', schluessel: ['jugend_bis_alter', 'statistik_einfrieren_am'] }
    ] },
    { id: 'aufnahme', titel: 'Online-Aufnahme', text: 'Aufnahmeanträge über das öffentliche Formular.', teile: [
      { titel: 'Eingang und Ablage', schluessel: ['antrag_eingangsdatei', 'antrag_endpunkt_regel', 'antrag_drive_ordner', 'antrag_dateiname'] },
      { titel: 'Ablauf', schluessel: ['antrag_abholung', 'antrag_doppelte_bestaetigung', 'antrag_dublettenpruefung', 'antrag_erinnerung_tage'] }
    ] },
    { id: 'ehrungen', titel: 'Ehrungen & Nachweise', text: 'Wie Mitgliedsjahre und Ämter für Ehrungen gezählt werden; Wiedervorlage von Nachweisen.', teile: [
      { titel: 'Ehrungen', schluessel: ['ehrung_zaehlweise', 'ehrung_stichtag', 'funktionsjubilaeum_zaehlweise'] },
      { titel: 'Nachweise', schluessel: ['fz_wiedervorlage_monate'] }
    ] },
    { id: 'schreiben', titel: 'Briefe & E-Mail', text: 'Absender und Gestaltung von Anschreiben und E-Mails, Versandschalter.', teile: [
      { titel: 'Briefe', schluessel: ['brief_absender', 'brief_unterschrift', 'brief_ort'] },
      { titel: 'E-Mail-Versand', schluessel: ['mail_aktiv', 'mail_test_an', 'mail_max_je_lauf', 'mail_pdf_anhang'] },
      { titel: 'Absender und Antwortadressen', schluessel: ['mail_absendername', 'mail_antwort_an', 'mail_antwort_an_finanzen'] },
      { titel: 'Gestaltung der E-Mails', schluessel: ['mail_briefkopf', 'mail_logo_url', 'mail_fusszeile'] }
    ] },
    { id: 'datenschutz', titel: 'Datenschutz', text: 'Fristen und Vorgehen bei Auskunft, Löschung und Anonymisierung.', teile: [
      { titel: 'Anfragen und Löschung', schluessel: ['loeschantwort_frist_tage', 'loeschlauf_intervall'] },
      { titel: 'Anonymisierung', schluessel: ['chronik_bei_anonymisierung', 'anonym_platzhalter'] }
    ] },
    { id: 'betrieb', titel: 'Betrieb & Technik', text: 'Technische Stellschrauben. Nur ändern, wenn klar ist, was sie bewirken.', teile: [
      { titel: 'Konto und Sicherung', schluessel: ['sheet_eigentuemer', 'backup_intervall'] },
      { titel: 'Leistung', schluessel: ['snapshot_einbetten', 'snapshot_sollstellung_jahre', 'cache_warmhalten', 'protokoll_nachgelagert', 'messung_puffer_max', 'sperre_wartezeit_ms'] }
    ] },
    { id: 'zaehler', titel: 'Systemzähler', text: 'Fortlaufende Nummern, die das System selbst vergibt – nur zur Ansicht.', muster: /^next_id_/ }
  ];
  var KONFIG_WEITERE = { id: 'weitere', titel: 'Weitere', text: 'Einstellungen, die noch keinem Bereich zugeordnet sind.' };

  /** Verständliche Namen der Einstellungen (Schlüssel bleibt klein darunter sichtbar). */

  function konfigTitel(s) {
    if (KONFIG_TITEL[s]) return KONFIG_TITEL[s];
    if (/^next_id_/.test(s)) return 'Nächste ID ' + s.slice(8).replace(/_/g, ' ');
    return titelVon(s);
  }

  /** Offene Punkte: Platzhalter oder fehlender Pflichtwert („offen“) bzw. Prüfvermerk in der Beschreibung („prüfen“). */
  function konfigStatus(k) {
    if (!k.bearbeitbar) return null;
    var w = String(k.wert || ''), b = String(k.beschreibung || '');
    if (/EINTRAGEN/.test(w) || (k.schluessel === 'verein_glaeubiger_id' && /^DE00ZZZ0+$/.test(w)) || (!w && /ECHTEN WERT/.test(b))) return 'offen';
    if (/PRÜFEN|OFFENER PUNKT|OFFEN:|BEISPIELWERT/.test(b)) return 'pruefen';
    return null;
  }

  /** Ordnet die Liste aus dem Server den Bereichen zu: [{ gruppe, teile: [{ titel, eintraege }] }]. */
  function konfigGliedern(liste) {
    var nach = {}, vergeben = {};
    liste.forEach(function (k) { nach[k.schluessel] = k; });
    var ergebnis = KONFIG_GRUPPEN.map(function (g) {
      var teile;
      if (g.muster) {
        var e = liste.filter(function (k) { return g.muster.test(k.schluessel) && !vergeben[k.schluessel]; });
        e.forEach(function (k) { vergeben[k.schluessel] = true; });
        teile = [{ titel: '', eintraege: e }];
      } else {
        teile = g.teile.map(function (t) {
          var e = t.schluessel.filter(function (s) { return nach[s]; }).map(function (s) { vergeben[s] = true; return nach[s]; });
          return { titel: t.titel, eintraege: e };
        });
      }
      return { gruppe: g, teile: teile.filter(function (t) { return t.eintraege.length; }) };
    });
    var rest = liste.filter(function (k) { return !vergeben[k.schluessel]; });
    if (rest.length) ergebnis.push({ gruppe: KONFIG_WEITERE, teile: [{ titel: '', eintraege: rest }] });
    return ergebnis.filter(function (x) { return x.teile.length; });
  }

  function konfigZeile(k) {
    var eingabe;
    if (k.typ === 'auswahl' || k.typ === 'janein') {
      eingabe = A.el('select');
      var werte = k.typ === 'janein' ? ['ja', 'nein'] : k.auswahl.slice();
      if (werte.indexOf(k.wert) < 0) werte.unshift(k.wert);   // unbekannten Altwert anzeigen statt still zu ersetzen
      werte.forEach(function (w) { eingabe.appendChild(A.el('option', w, { value: w })); });
    } else eingabe = A.el('input', null, { type: 'text' });
    eingabe.value = k.wert;
    eingabe.disabled = !k.bearbeitbar;
    eingabe.setAttribute('aria-label', konfigTitel(k.schluessel) + ' (' + k.schluessel + ')');
    var fehler = A.el('span', '', { className: 'feldfehler' });
    var bisher = k.wert;
    var status = konfigStatus(k);
    var marke = status ? A.el('span', status === 'offen' ? 'offen' : 'prüfen', { className: 'marke vw-marke-' + status }) : null;
    var zeile;
    function geaendert() {
      var anders = eingabe.value !== bisher;
      knopf.disabled = !anders;
      zeile.classList.toggle('geaendert', anders);
    }
    var knopf = A.knopf('Speichern', function () {
      knopf.disabled = true; fehler.textContent = '';
      return A.rufe('apiVerwaltungKonfigSpeichern', k.schluessel, eingabe.value, bisher, A.still).then(function (r) {
        bisher = r.wert; eingabe.value = r.wert; k.wert = r.wert;
        if (marke && konfigStatus(k) !== 'offen' && status === 'offen') marke.remove();
        A.meldung(r.geaendert ? 'Einstellung „' + konfigTitel(k.schluessel) + '“ (' + k.schluessel + ') gespeichert.' : 'Keine Änderung.', 'ok');
      }, function (err) {
        if (err.felder && err.felder[0]) fehler.textContent = err.felder[0].meldung;
        else if (err.art === 'konflikt') fehler.textContent = 'Inzwischen geändert – bitte neu laden.';
        else A.fehler(err);
      }).then(geaendert);
    }, 'zweit klein');
    knopf.hidden = !k.bearbeitbar;
    knopf.disabled = true;
    eingabe.addEventListener('input', geaendert);
    eingabe.addEventListener('change', geaendert);
    eingabe.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !knopf.disabled) { e.preventDefault(); knopf.click(); } });
    zeile = A.el('div', null, { className: 'vw-konfig' }, [
      A.el('div', null, null, [
        A.el('div', null, { className: 'vw-konfig-titel' }, [A.el('strong', konfigTitel(k.schluessel)), marke]),
        k.beschreibung ? A.el('div', k.beschreibung, { className: 'leise' }) : null,
        A.el('code', k.schluessel)
      ]),
      A.el('div', null, null, [A.el('div', null, { className: 'zeile' }, [eingabe, knopf]), fehler])
    ]);
    return zeile;
  }

  function reiterEinstellungen(ziel, param) {
    var l = laedt(ziel);
    A.rufe('apiVerwaltungKonfig').then(function (liste) {
      l.remove();
      var gliederung = konfigGliedern(liste);
      var zeilen = {};   // Zeilen nur einmal bauen: Eingaben bleiben beim Wechsel der Bereiche erhalten
      function zeileVon(k) { return zeilen[k.schluessel] || (zeilen[k.schluessel] = konfigZeile(k)); }
      var aktiv = (param && param.gruppe && gliederung.some(function (x) { return x.gruppe.id === param.gruppe; })) ? param.gruppe : gliederung[0].gruppe.id;

      ziel.appendChild(A.el('p', 'Änderungen wirken sofort für alle und werden protokolliert. Jede Einstellung wird einzeln gespeichert.', { className: 'leise' }));

      var suche = A.el('input', null, { type: 'search', placeholder: 'Einstellung suchen …', className: 'suche' });
      suche.setAttribute('aria-label', 'Einstellung suchen');
      var nurOffen = A.el('input', null, { type: 'checkbox', id: 'vw-nur-offen' });
      var anzahlOffen = liste.filter(function (k) { return konfigStatus(k); }).length;
      var offenLabel = A.el('label', null, { htmlFor: 'vw-nur-offen', className: 'vw-schalter' }, [nurOffen, A.el('span', 'Nur offene Punkte (' + anzahlOffen + ')')]);
      ziel.appendChild(A.el('div', null, { className: 'filterleiste' }, [suche, offenLabel]));

      var nav = A.el('nav', null, { className: 'vw-bereiche', aria: { label: 'Bereiche der Einstellungen' } });
      var inhalt = A.el('div', null, { className: 'vw-bereich' });
      ziel.appendChild(A.el('div', null, { className: 'vw-einstellungen' }, [nav, inhalt]));

      var knoepfe = {};
      gliederung.forEach(function (x) {
        var offen = 0;
        x.teile.forEach(function (t) { t.eintraege.forEach(function (k) { if (konfigStatus(k) === 'offen') offen++; }); });
        var b = A.el('button', null, { type: 'button' }, [
          A.el('span', x.gruppe.titel),
          offen ? A.el('span', String(offen), { className: 'vw-zahl', title: offen + ' offen', aria: { label: offen + ' offen' } }) : null
        ]);
        b.addEventListener('click', function () {
          aktiv = x.gruppe.id; suche.value = ''; nurOffen.checked = false; zeichne();
          inhalt.scrollIntoView({ block: 'nearest' });
        });
        knoepfe[x.gruppe.id] = b;
        nav.appendChild(b);
      });

      function teilKarte(titel, eintraege) {
        return A.el('section', null, { className: 'karte vw-teil' }, [titel ? A.el('h3', titel) : null].concat(eintraege.map(zeileVon)));
      }

      function zeichne() {
        A.leere(inhalt);
        var t = A.falte(suche.value || '').trim();
        var gefiltert = !!t || nurOffen.checked;
        Object.keys(knoepfe).forEach(function (id) {
          if (!gefiltert && id === aktiv) knoepfe[id].setAttribute('aria-current', 'true');
          else knoepfe[id].removeAttribute('aria-current');
        });
        if (!gefiltert) {
          var x = gliederung.filter(function (y) { return y.gruppe.id === aktiv; })[0];
          inhalt.appendChild(A.el('h2', x.gruppe.titel));
          if (x.gruppe.text) inhalt.appendChild(A.el('p', x.gruppe.text, { className: 'leise' }));
          x.teile.forEach(function (teil) { inhalt.appendChild(teilKarte(teil.titel, teil.eintraege)); });
          return;
        }
        var treffer = 0;
        gliederung.forEach(function (x) {
          var teile = x.teile.map(function (teil) {
            return { titel: teil.titel, eintraege: teil.eintraege.filter(function (k) {
              if (nurOffen.checked && !konfigStatus(k)) return false;
              return !t || A.falte([k.schluessel, konfigTitel(k.schluessel), k.beschreibung, x.gruppe.titel, teil.titel].join(' ')).indexOf(t) >= 0;
            }) };
          }).filter(function (teil) { return teil.eintraege.length; });
          if (!teile.length) return;
          inhalt.appendChild(A.el('h2', x.gruppe.titel));
          teile.forEach(function (teil) { treffer += teil.eintraege.length; inhalt.appendChild(teilKarte(teil.titel, teil.eintraege)); });
        });
        if (!treffer) inhalt.appendChild(A.el('p', 'Keine Einstellung gefunden.', { className: 'leise' }));
      }
      suche.addEventListener('input', A.verzoegert(zeichne, 150));
      nurOffen.addEventListener('change', zeichne);
      zeichne();
    }).catch(function (e) {
      if (window.console) console.error(e);
      fehlerText(ziel, 'Die Einstellungen konnten nicht geladen werden.', function () { A.leere(ziel); reiterEinstellungen(ziel, param); });
    });
  }

  function janein(v) { return v === true ? 'ja' : v === false ? 'nein' : '–'; }
  function leerStrich(v) { return v === null || v === undefined || v === '' ? '–' : v; }
  function euro(v) { return v === null || v === undefined || v === '' ? '–' : A.betrag(v); }

      ] },
    { tab: 'Aufbewahrungsfrist', titel: 'Aufbewahrungsfristen', name: 'datenkategorie',
      text: 'Wie lange welche Daten aufbewahrt werden – Grundlage für Sperren, Anonymisieren und Löschen.',
      spalten: [
        { feld: 'betrifft_tab', titel: 'Betrifft', wert: function (z) { return leerStrich(z.betrifft_tab); } },
        { feld: 'dauer_monate', titel: 'Dauer', zahl: true, wert: function (z) { return z.dauer_monate == null ? '–' : z.dauer_monate + ' Monate'; }, sort: function (z) { return Number(z.dauer_monate) || 0; } },
        { feld: 'bezugspunkt', titel: 'ab', wert: function (z) { return leerStrich(z.bezugspunkt); } },
        { feld: 'rechtsgrundlage', titel: 'Rechtsgrundlage', wert: function (z) { return leerStrich(z.rechtsgrundlage); } }
      ],
      formular: [
        { gruppe: 'Frist', felder: ['datenkategorie', 'betrifft_tab', 'dauer_monate', 'bezugspunkt', 'aktiv'] },
        { gruppe: 'Grundlage', felder: ['rechtsgrundlage', 'bemerkung'] }
      ] }
  ];

  function stammDef(tab) { return STAMM.filter(function (s) { return s.tab === tab; })[0]; }

  /** Dialogfelder mit Feldgruppen; Felder aus dem Katalog, die keiner Gruppe zugeordnet sind, kommen ans Ende. */
  function stammFormularFelder(def, namen) {
    var vergeben = {}, liste = [];
    (def.formular || []).forEach(function (g) {
      var f = g.felder.filter(function (n) { return namen.indexOf(n) >= 0; });
      if (!f.length) return;
      f.forEach(function (n) { vergeben[n] = true; });
      liste.push({ gruppe: g.gruppe });
      liste = liste.concat(felderAus(def.tab, f, HILFE[def.tab]));
    });
    var rest = namen.filter(function (n) { return !vergeben[n]; });
    if (rest.length) { liste.push({ gruppe: 'Weitere Angaben' }); liste = liste.concat(felderAus(def.tab, rest, HILFE[def.tab])); }
    return liste;
  }

  /** Abhängige Felder ein-/ausblenden (Werte bleiben erhalten und werden mitgespeichert). */
  function stammAbhaengig(def, form) {
    var a = def.abhaengig;
    var steuer = a && form.feld(a.feld);
    if (!steuer) return;
    function pruefe() {
      var an = a.gesetzt ? !!steuer.value : steuer.value === a.wert;
      a.felder.forEach(function (n) { var e = form.feld(n); if (e && e.closest('.feld')) e.closest('.feld').style.display = an ? '' : 'none'; });
    }
    steuer.addEventListener('change', pruefe);
    pruefe();
  }

  function reiterStammdaten(ziel, param) {
    var wahl = (param && stammDef(param.tab)) ? param.tab : 'Abteilung';
    var def = stammDef(wahl);
    var neu = function () { A.zeige('verwaltung', { reiter: 'stammdaten', tab: wahl }, true); };

    var nav = A.el('nav', null, { className: 'vw-bereiche', aria: { label: 'Arten der Stammdaten' } });
    STAMM_GRUPPEN.forEach(function (g) {
      nav.appendChild(A.el('span', g.titel, { className: 'vw-bereiche-kopf' }));
      g.arten.forEach(function (tab) {
        var s = stammDef(tab);
        var b = A.el('button', s.titel, { type: 'button' });
        if (tab === wahl) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () { if (tab !== wahl) A.zeige('verwaltung', { reiter: 'stammdaten', tab: tab }, true); });
        nav.appendChild(b);
      });
    });
    var bereich = A.el('div', null, { className: 'vw-bereich' });
    ziel.appendChild(A.el('div', null, { className: 'vw-einstellungen' }, [nav, bereich]));
    setTimeout(function () { var b = nav.querySelector('[aria-current]'); if (b && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = b.offsetLeft - 16; }, 0);

    laedt(bereich);
    A.rufe('apiVerwaltungStammdaten', wahl).then(function (d) {
      A.leere(bereich);
      var namen = fachfelder(wahl);
      function dialog(z) {
        var form = A.formular(stammFormularFelder(def, namen), z || { aktiv: true });
        stammAbhaengig(def, form);
        speicherDialog((z ? def.titel + ': ' + (z[def.name] || 'Eintrag') + ' bearbeiten' : def.titel + ': neuer Eintrag'), form, 'apiVerwaltungStammdatenSpeichern',
          [wahl, z ? z[d.idSpalte] : null, z ? z.version : null], neu);
      }
      var ruhend = d.zeilen.filter(function (z) { return z.aktiv === false; }).length;
      bereich.appendChild(A.abschnitt(def.titel, [A.knopf('Neu', function () { dialog(null); })]));
      bereich.appendChild(A.el('p', def.text + ' Einträge werden nicht gelöscht, sondern auf „aktiv: nein“ gesetzt.', { className: 'leise' }));
      var filter = [];
      if (namen.indexOf('aktiv') >= 0) filter.push({ name: 'status', titel: 'Status', start: 'aktiv',
        liste: [{ wert: 'aktiv', text: 'nur aktive (' + (d.zeilen.length - ruhend) + ')' }, { wert: 'ruhend', text: 'nur ruhende (' + ruhend + ')' }] });
      var leiste = A.filterleiste(filter, zeichne, def.titel + ' durchsuchen …');
      var liste = A.el('div');
      bereich.appendChild(leiste);
      bereich.appendChild(liste);

      function zeichne(zu) {
        A.leere(liste);
        var t = A.falte(zu.suche || '').trim();
        var zeilen = d.zeilen.filter(function (z) {
          if (zu.status === 'aktiv' && z.aktiv === false) return false;
          if (zu.status === 'ruhend' && z.aktiv !== false) return false;
          return !t || A.falte(namen.map(function (n) { return z[n] == null ? '' : String(z[n]); }).join(' ')).indexOf(t) >= 0;
        });
        var teile = {}, folge = (def.reihenfolge || []).slice();
        zeilen.forEach(function (z) {
          var k = def.unterteilung ? def.unterteilung(z) : '';
          if (!teile[k]) { teile[k] = []; if (folge.indexOf(k) < 0) folge.push(k); }
          teile[k].push(z);
        });
        if (!def.unterteilung) folge = [''];
        var gezeigt = 0;
        folge.forEach(function (k) {
          var z = teile[k];
          if (!z || !z.length) return;
          gezeigt += z.length;
          if (def.sortiere) z.sort(function (a, b) { return def.sortiere(a) - def.sortiere(b); });
          var extra = (def.spaltenTeil && def.spaltenTeil[k]) || def.spalten;
          var spalten = [{ feld: def.name, titel: titelVon(def.name) }].concat(extra).concat([
            { feld: 'aktiv', titel: 'Status', wert: function (x) { return x.aktiv === false ? A.ampel('grau', 'ruht') : A.ampel('gruen', 'aktiv'); } }
          ]);
          var karte = A.el('section', null, { className: 'karte vw-teil' });
          if (k) karte.appendChild(A.el('h3', k + ' (' + z.length + ')'));
          karte.appendChild(A.tabelle(spalten, z, { beiKlick: dialog, sortiere: def.sortiere ? null : def.name, karten: true, kartenTitel: def.name }));
          liste.appendChild(karte);
        });
        if (!gezeigt) liste.appendChild(A.el('p', d.zeilen.length ? 'Keine Einträge zu diesem Filter.' : 'Noch keine Einträge.', { className: 'leise' }));
      }
      zeichne(leiste.zustand);
    }).catch(function (e) {
      if (window.console) console.error(e);
      fehlerText(bereich, 'Die Stammdaten konnten nicht geladen werden.', neu);
    });
  }

  // ================================================================== Datenqualität

  function reiterDatenqualitaet(ziel) {
    var l = laedt(ziel);
    A.rufe('apiVerwaltungPruefregeln').then(function (d) {
      l.remove();
      var z = d.zusammenfassung;
      var kacheln = A.el('div', null, { className: 'kacheln' }, [
        A.kachel(A.zahl(z.fehler), 'Fehler', z.fehler ? 'fehler' : ''),
        A.kachel(A.zahl(z.warnung), 'Warnungen', z.warnung ? 'warnung' : ''),
        A.kachel(A.zahl(z.hinweis), 'Hinweise', '')
      ]);
      ziel.appendChild(kacheln);
      // Datumsangaben in Meldungen der Prüfregeln (JJJJ-MM-TT) für die Anzeige als TT.MM.JJJJ schreiben
      d.befunde.forEach(function (b) { b.meldung = String(b.meldung || '').replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, '$3.$2.$1'); });
      var regeln = Object.keys(z.je_regel).map(function (r) { return { wert: r, text: z.je_regel[r].titel + ' (' + z.je_regel[r].anzahl + ')' }; });
      var tabelle = null;
      var leiste = A.filterleiste([
        { name: 'schwere', titel: 'Schwere', liste: [{ wert: 'fehler', text: 'Fehler' }, { wert: 'warnung', text: 'Warnung' }, { wert: 'hinweis', text: 'Hinweis' }] },
        { name: 'regel', titel: 'Regel', liste: regeln }
      ], function (zu) { tabelle.aktualisiere(gefiltert(zu)); }, 'Person oder Meldung …');
      function gefiltert(zu) {
        var t = A.falte(zu.suche || '');
        return d.befunde.filter(function (b) {
          if (zu.schwere && b.schwere !== zu.schwere) return false;
          if (zu.regel && b.regel !== zu.regel) return false;
          return !t || A.falte((b.person || '') + ' ' + b.meldung + ' ' + b.titel).indexOf(t) >= 0;
        });
      }
      var spalten = [
        { feld: 'schwere', titel: 'Schwere', wert: function (b) { return A.ampel(b.schwere === 'fehler' ? 'rot' : b.schwere === 'warnung' ? 'gelb' : 'grau', b.schwere); } },
        { feld: 'titel', titel: 'Regel' },
        { feld: 'person', titel: 'Person / Datensatz', wert: function (b) { return b.person || (b.tab + ' ' + b.id); } },
        { feld: 'meldung', titel: 'Meldung' }
      ];
      ziel.appendChild(A.abschnitt('Befunde', [A.knopf('CSV', function () {
        A.csv('Datenqualitaet_' + A.heute() + '.csv', [
          { titel: 'Schwere', wert: function (b) { return b.schwere; } }, { titel: 'Regel', wert: function (b) { return b.titel; } },
          { titel: 'Tabelle', wert: function (b) { return b.tab; } }, { titel: 'ID', wert: function (b) { return b.id; } },
          { titel: 'Person', wert: function (b) { return b.person || ''; } }, { titel: 'Meldung', wert: function (b) { return b.meldung; } }
        ], gefiltert(leiste.zustand));
      }, 'zweit')]));
      ziel.appendChild(leiste);
      tabelle = A.tabelle(spalten, d.befunde, { leer: 'Keine Befunde – die Daten sind sauber.', beiKlick: function (b) {
        if (b.mitglied_id) A.zeige('mitglied', { id: b.mitglied_id });
        else if (b.tab === 'Beitragskonto') A.zeige('konto', { id: b.id });
      } });
      ziel.appendChild(tabelle);
    }).catch(function () {
      fehlerText(ziel, 'Die Prüfergebnisse konnten nicht geladen werden.', function () { A.leere(ziel); reiterDatenqualitaet(ziel); });
    });
  }

  // ================================================================== System

  // Testdaten einspielen: nur sichtbar, wenn der Server es freigibt (Test-Umgebung, Mitgliederverwalter).
  // Die Datei liest NUR dieser Browser; zum Server gehen die Zeilen in Blöcken (src/modul/Testdaten.js).
  var TESTDATEN_MAX_BYTES = 30 * 1024 * 1024;

  function testdatenBereich(ziel) {
    ziel.appendChild(A.el('h2', 'Testdaten einspielen (Test-Umgebung)'));
    ziel.appendChild(A.el('p', 'Ersetzt Mitglieder, Zeiträume, Abteilungen, Funktionen, Konten, Gemeinschaften, Sollstellungen, Qualifikationen, ' +
      'Ehrungen und Einwilligungen durch einen erfundenen Verein aus „npm run testdaten“ (Datei testdaten.json). Benutzer, Stammdaten, ' +
      'Einstellungen und Protokoll bleiben.', { className: 'leise' }));
    var eingabe = A.el('input', null, { type: 'file', accept: '.json,application/json', className: 'td-datei' });
    eingabe.setAttribute('aria-label', 'Datei testdaten.json auswählen');
    var bereich = A.el('div', null, { className: 'td-bereich' });
    ziel.appendChild(eingabe);
    ziel.appendChild(bereich);
    eingabe.addEventListener('change', function () {
      A.leere(bereich);
      var f = eingabe.files && eingabe.files[0];
      if (!f) return;
      if (f.size > TESTDATEN_MAX_BYTES) { bereich.appendChild(A.el('p', 'Datei zu groß.', { className: 'meldung' })); return; }
      var r = new FileReader();
      r.onerror = function () { bereich.appendChild(A.el('p', 'Datei nicht lesbar.', { className: 'meldung' })); };
      r.onload = function () {
        var d = null;
        try { d = JSON.parse(r.result); } catch (e) { d = null; }
        if (!d || d.art !== 'mitgliederverwaltung-testdaten' || !d.tabs) {
          bereich.appendChild(A.el('p', 'Das ist keine Datei aus „npm run testdaten“.', { className: 'meldung' }));
          return;
        }
        testdatenVorschau(bereich, d);
      };
      r.readAsText(f, 'utf-8');
    });
  }

  function testdatenVorschau(bereich, d) {
    var e = d.erzeugt || {};
    bereich.appendChild(A.el('p', 'Erzeugt mit seed ' + e.seed + ', ' + e.mitglieder + ' Mitglieder, Stichtag ' + A.datum(e.stichtag) + '.'));
    bereich.appendChild(A.tabelle([{ feld: 'tab', titel: 'Tabelle' }, { feld: 'n', titel: 'Zeilen', zahl: true }],
      Object.keys(d.tabs).map(function (t) { return { tab: t, n: d.tabs[t].zeilen.length }; }), { block: 40 }));
    var stand = A.el('p', '', { className: 'leise td-stand', role: 'status' });
    var knopf = A.knopf('Einspielen', function () {
      return A.bestaetige('Testdaten einspielen', 'Alle Mitglieder und Bewegungsdaten DIESER Test-Tabelle werden gelöscht und durch den ' +
        'erfundenen Verein ersetzt. Das lässt sich nicht rückgängig machen.', 'Ersetzen', 'gefahr').then(function (ja) {
        if (!ja) return;
        knopf.disabled = true;
        return testdatenSenden(d, stand).then(function (res) {
          stand.textContent = 'Fertig – Snapshot neu aufgebaut.';
          return A.ladeNeu().then(function () {
            A.meldung('Testdaten eingespielt: ' + Object.keys(res.tabs).map(function (t) { return t + ' ' + res.tabs[t]; }).join(', ') + '.', 'ok');
          });
        }, function () { stand.textContent = 'Abgebrochen. Die Test-Tabelle kann teilweise gefüllt sein – bitte erneut einspielen.'; })
          .then(function () { knopf.disabled = false; });
      });
    }, 'gefahr');
    bereich.appendChild(A.el('div', null, { className: 'knopfleiste' }, [knopf]));
    bereich.appendChild(stand);
  }

  /** start → Blöcke je Tab nacheinander → ende. Liefert das Ergebnis von apiTestdatenEnde. */
  function testdatenSenden(d, stand) {
    var info = { art: d.art, version: d.version, synthetisch: d.synthetisch, erzeugt: d.erzeugt, konfig: d.konfig, tabs: {} };
    Object.keys(d.tabs).forEach(function (t) { info.tabs[t] = { kopf: d.tabs[t].kopf, anzahl: d.tabs[t].zeilen.length }; });
    var gesamt = 0, fertig = 0;
    return A.rufe('apiTestdatenStart', info).then(function (s) {
      var auftraege = [];
      s.tabs.forEach(function (t) {
        var zeilen = d.tabs[t].zeilen;
        gesamt += zeilen.length;
        for (var v = 0; v < zeilen.length; v += s.block) auftraege.push({ tab: t, von: v, zeilen: zeilen.slice(v, v + s.block) });
      });
      return auftraege.reduce(function (kette, a) {
        return kette.then(function () {
          stand.textContent = a.tab + ' … (' + Math.round(100 * fertig / Math.max(gesamt, 1)) + ' %)';
          return A.rufe('apiTestdatenBlock', a.tab, a.von, a.zeilen).then(function () { fertig += a.zeilen.length; });
        });
      }, Promise.resolve());
    }).then(function () {
      stand.textContent = 'Zähler und Snapshot …';
      return A.rufe('apiTestdatenEnde');
    });
  }

  function reiterSystem(ziel) {
    var l = laedt(ziel);
    A.rufe('apiVerwaltungSystem').then(function (d) {
      l.remove();
      ziel.appendChild(A.details([
        ['Snapshot gebaut', A.datum(d.snapshot_gebaut_am, true)],
        ['Cache beim letzten Laden', d.cache || '–'],
        ['Serverzeit', A.datum(d.jetzt, true)],
        ['Snapshot im Browser', (A.daten.bereiche || []).join(', ')]
      ]));
      ziel.appendChild(A.el('div', null, { className: 'knopfleiste' }, [
        A.knopf('Snapshot neu aufbauen', function (ev) {
          var k = ev.target; k.disabled = true;
          return A.rufe('apiVerwaltungSnapshotNeu').then(function () { return A.ladeNeu(); })
            .then(function () { A.meldung('Snapshot neu aufgebaut und geladen.', 'ok'); }, function () {})
            .then(function () { k.disabled = false; });
        }, 'zweit'),
        A.darf('messung_lesen') ? A.knopf('Messwerte', function () { A.zeige('messwerte'); }, 'zweit') : null
      ]));
      ziel.appendChild(A.el('p', '„Snapshot neu aufbauen“ ist nur nötig, wenn jemand direkt in der Tabelle geändert hat – im Normalbetrieb hält sich der Snapshot selbst aktuell.', { className: 'leise' }));
      if (d.testdaten) testdatenBereich(ziel);
      ziel.appendChild(A.el('h2', 'Zeilen je Tabelle'));
      ziel.appendChild(A.tabelle([{ feld: 'tab', titel: 'Tabelle' }, { feld: 'n', titel: 'Zeilen', zahl: true }],
        Object.keys(d.zeilen).map(function (t) { return { tab: t, n: d.zeilen[t] }; }), { sortiere: 'tab', block: 40 }));
    }).catch(function () {
      fehlerText(ziel, 'Die Systemangaben konnten nicht geladen werden.', function () { A.leere(ziel); reiterSystem(ziel); });
    });
  }

  // ================================================================== Ansicht

  A.registriere('verwaltung', {
    titel: 'Verwaltung', aktion: 'stammdaten_bearbeiten', reihenfolge: 80,
    zeichne: function (ziel, param) {
      var reiter = [];
      if (A.darf('benutzer_verwalten')) reiter.push({ schluessel: 'benutzer', titel: 'Benutzer' });
      if (A.darf('konfig_aendern')) reiter.push({ schluessel: 'einstellungen', titel: 'Einstellungen' });
      if (A.darf('stammdaten_bearbeiten')) {
        reiter.push({ schluessel: 'stammdaten', titel: 'Stammdaten' });
        reiter.push({ schluessel: 'datenqualitaet', titel: 'Datenqualität' });
      }
      if (A.darf('konfig_aendern')) reiter.push({ schluessel: 'system', titel: 'System' });
      var aktiv = param && param.reiter && reiter.some(function (r) { return r.schluessel === param.reiter; }) ? param.reiter : (reiter[0] || {}).schluessel;
      ziel.appendChild(A.el('h1', 'Verwaltung'));
      ziel.appendChild(reiterLeiste(reiter, aktiv, function (s) { A.zeige('verwaltung', { reiter: s }, true); }));
      var inhalt = A.el('div');
      ziel.appendChild(inhalt);
      if (aktiv === 'benutzer') reiterBenutzer(inhalt);
      else if (aktiv === 'einstellungen') reiterEinstellungen(inhalt, param);
      else if (aktiv === 'stammdaten') reiterStammdaten(inhalt, param);
      else if (aktiv === 'datenqualitaet') reiterDatenqualitaet(inhalt);
      else if (aktiv === 'system') reiterSystem(inhalt);
    }
  });
})();
</script>
