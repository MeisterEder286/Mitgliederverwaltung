<!--
  ansicht_korrespondenz – Dokumente und Anschreiben („Schreiben“).

  Zweck:      Briefe aus Vorlagen erstellen und drucken (einzeln oder als Serienbrief: Aufnahme- und Austritts-
              bestätigung, Rechnung, Mahnung, SEPA-Vorabinformation, Umstellung auf Einzelbeitrag …), erstellte Schreiben
              ansehen/nachdrucken, Vorlagen pflegen, Serienbrief-Export für Word. Dazu Links auf Aufnahmeantrag und
              SEPA-Mandat: als Reiter „Dokumente & Schreiben“ im Mitglied-Detail und als Abschnitt im Konto-Detail
              (über die Erweiterungspunkte App.erweitere, ohne die anderen Ansichtsdateien zu ändern).
  Datenquelle: App.daten (Kern: vorlagen ohne Text; Bereich „korrespondenz“: dokumente, anschreiben ohne Inhalt) und
              apiKorrespondenz…-Funktionen (src/api/Korrespondenz.js).
  Wer darf:   anschreiben_erstellen (Schreiben, Export), dokumente_verwalten (Links), stammdaten_bearbeiten (Vorlagen
              pflegen) – serverseitig erzwungen; App.darf blendet nur aus.
  Besonderheiten:
    - Andere Ansichten öffnen „Schreiben“ mit Vorauswahl: App.zeige('korrespondenz', { anlass, mitglied_ids |
      beitragskonto_ids | sollstellung_ids, jahr }).
    - Briefe werden in einem eigenen Druckfenster gesetzt (A4, Anschriftfeld für Fensterumschlag nach DIN 5008),
      alle Texte per textContent – Vorlagen können kein HTML einschleusen.
    - E-Mail: Kanal je Empfänger (Brief | E-Mail, Standard nach Versandart und vorhandener Adresse). „E-Mails senden“
      nur mit mail_senden (apiMailSenden, src/api/Mail.js); Versand, Testmodus und Kontingent prüft der Server.
      Die Mail-Vorschau ist aus DOM-Elementen gebaut (textContent) – kein iframe, kein HTML aus Daten.
    - Reiter „Postausgang“: fällige Schreiben (apiMailVorschlaege), „Vorbereiten“ öffnet „Neues Schreiben“ mit Anlass
      und Empfängern. Es wird nie automatisch etwas gesendet.
-->
<style>
  .ko-brief { white-space: pre-wrap; border: 1px solid var(--rand); border-radius: var(--radius); padding: 12px; margin: 0 0 12px; background: #fff; }
  .ko-brief .ko-adr { color: var(--text-leise); margin: 0 0 8px; white-space: pre-line; }
  .ko-brief .ko-betreff { font-weight: 600; margin: 0 0 8px; }
  .ko-warnung { background: #fff6dc; color: #5c4400; padding: 8px 12px; border-radius: var(--radius); margin: 0 0 12px; }
  .ko-doks { list-style: none; padding: 0; margin: 0 0 12px; }
  .ko-doks li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--flaeche); }
  .ko-doks a { min-height: 44px; display: inline-flex; align-items: center; overflow-wrap: anywhere; }
  .ko-platzhalter { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
  .ko-platzhalter button { min-height: 36px; font: inherit; font-size: 0.85rem; padding: 2px 8px; border: 1px solid var(--rand); border-radius: 999px; background: var(--flaeche); cursor: pointer; }
  .ko-auswahl input[type="checkbox"] { width: 20px; height: 20px; }
  .ko-mailvorschau { border: 1px solid var(--rand); border-radius: var(--radius); margin: 0 0 12px; background: #fff; overflow: hidden; }
  .ko-mailvorschau .ko-mkopf { background: #0b4f8a; color: #fff; padding: 10px 12px; }
  .ko-mailvorschau .ko-mkopf div:first-child { font-weight: 600; }
  .ko-mailvorschau .ko-mbetreff { font-weight: 600; padding: 10px 12px 0; }
  .ko-mailvorschau .ko-mtext { white-space: pre-wrap; padding: 8px 12px; overflow-wrap: anywhere; }
  .ko-mailvorschau .ko-mfuss { border-top: 1px solid var(--rand); padding: 8px 12px; font-size: 0.85rem; color: var(--text-leise); white-space: pre-line; }
  .ko-kanal select { min-height: 40px; font: inherit; }
  .ko-gruppe { margin: 0 0 12px; }
  .ko-gruppe ul { margin: 4px 0 8px; padding-left: 20px; }
  .ko-gruppe li { overflow-wrap: anywhere; }
</style>
<script>
(function () {
  'use strict';
  var A = window.App;
  var vorlagenSpeicher = null;   // { vorlagen (mit Text), katalog, anlaesse } – einmal je Sitzung

  // ------------------------------------------------------------------ Hilfen

  function laedt(ziel, bereich, weiter) {
    if (A.daten.geladen(bereich)) { weiter(); return; }
    var p = A.el('p', 'Lädt …', { className: 'laedt' });
    ziel.appendChild(p);
    A.daten.lade(bereich).then(function () { if (p.parentNode) { p.remove(); weiter(); } })
      .catch(function () { p.textContent = 'Konnte nicht geladen werden.'; });
  }
  function ladeVorlagen(neu) {
    if (vorlagenSpeicher && !neu) return Promise.resolve(vorlagenSpeicher);
    return A.rufe('apiKorrespondenzVorlagen').then(function (d) { vorlagenSpeicher = d; return d; });
  }
  function mitglied(id) { return A.daten.hole('mitglieder', id); }
  function linkEl(text, url) {
    var a = A.el('a', text, { href: url, target: '_blank', rel: 'noopener noreferrer' });
    return a;
  }
  /** Nach dem Speichern neu zeichnen – im Mitglied-Detail auf dem Reiter „Dokumente & Schreiben“ bleiben. */
  function neuZeichnen() {
    var a = A.aktuell();
    if (a.schluessel === 'mitglied') A.zeige('mitglied', Object.assign({}, a.param || {}, { reiter: 'dokumente' }), true);
    else A.neuZeichnen();
  }

  function anlassVorschlag(m) {
    if (!m) return null;
    var s = m.status_abgeleitet || m.status;
    if (s === 'ausgetreten' || m.gekuendigt_zum) return 'Austrittsbestätigung';
    if (m.mitglied_seit) {
      var tage = (new Date(A.heute()) - new Date(m.mitglied_seit)) / 86400000;
      if (tage >= 0 && tage < 60) return 'Aufnahmebestätigung';
    }
    return null;
  }

  // ------------------------------------------------------------------ Druck

  /** Briefe im eigenen Fenster setzen und drucken. briefe: [{ absender, empfaenger:[…], ort_datum, betreff, text, gruss }] */
  function drucke(briefe, titel) {
    var w = window.open('', '_blank');
    if (!w) { A.meldung('Das Druckfenster wurde blockiert. Bitte Pop-ups für diese Seite erlauben.', 'fehler'); return; }
    var doc = w.document;
    doc.title = titel || 'Schreiben';
    var st = doc.createElement('style');
    st.textContent = '@page{size:A4;margin:0}body{margin:0;font-family:system-ui,Arial,sans-serif;font-size:11pt;color:#000}' +
      '.seite{position:relative;width:210mm;min-height:297mm;box-sizing:border-box;padding:20mm 20mm 20mm 25mm;page-break-after:always}' +
      '.seite:last-child{page-break-after:auto}' +
      '.abs{position:absolute;top:45mm;left:25mm;width:85mm;font-size:7pt;border-bottom:0.3pt solid #000;padding-bottom:1mm}' +
      '.an{position:absolute;top:51mm;left:25mm;width:85mm;height:34mm;white-space:pre-line;line-height:1.3}' +
      '.datum{margin-top:85mm;text-align:right}.betreff{font-weight:bold;margin:8mm 0 6mm}' +
      '.text{white-space:pre-wrap;line-height:1.45}.gruss{margin-top:8mm;white-space:pre-line}' +
      '@media screen{body{background:#ddd}.seite{background:#fff;margin:8px auto;box-shadow:0 0 4px #999}}';
    doc.head.appendChild(st);
    briefe.forEach(function (b) {
      var s = doc.createElement('div'); s.className = 'seite';
      [['abs', b.absender], ['an', (b.empfaenger || []).join('\n')], ['datum', b.ort_datum], ['betreff', b.betreff],
        ['text', b.text], ['gruss', b.gruss]].forEach(function (p) {
        var d = doc.createElement('div'); d.className = p[0]; d.textContent = p[1] || ''; s.appendChild(d);
      });
      doc.body.appendChild(s);
    });
    w.focus();
    setTimeout(function () { try { w.print(); } catch (e) { /* manche Browser drucken erst nach Klick */ } }, 300);
  }

  /** Vorschau-Karte eines Briefs (Text per textContent, Zeilenumbrüche über CSS). */
  function briefKarte(b) {
    return A.el('div', null, { className: 'ko-brief' }, [
      A.el('p', (b.empfaenger || []).join('\n'), { className: 'ko-adr' }),
      A.el('p', b.betreff, { className: 'ko-betreff' }),
      A.el('div', b.text)
    ]);
  }

  /** Versandstatus (Schalter, Testmodus, Briefkopf) – einmal je Aufruf der Ansicht. */
  var mailStatus = null;
  function ladeMailStatus() {
    if (mailStatus) return Promise.resolve(mailStatus);
    return A.rufe('apiMailStatus', A.still).then(function (s) { mailStatus = s; return s; }, function () { return { aktiv: false, testmodus: false, darf_senden: false, briefkopf: [], fusszeile: [] }; });
  }
  function mailMoeglich(st) { return !!(st && st.darf_senden && (st.aktiv || st.testmodus)); }

  /** Mail-Vorschau aus DOM-Elementen (Briefkopf, Betreff, Text, Gruß, Fußzeile – alles textContent). */
  function mailVorschau(b, st) {
    var kopf = A.el('div', null, { className: 'ko-mkopf' });
    (st.briefkopf || []).forEach(function (z) { kopf.appendChild(A.el('div', z)); });
    var box = A.el('div', null, { className: 'ko-mailvorschau' }, [
      kopf,
      A.el('div', 'An: ' + (st.testmodus ? (st.test_an || 'Testadresse') + ' (Testmodus, eigentlich ' + b.email + ')' : b.email), { className: 'ko-mtext leise' }),
      A.el('div', (st.testmodus ? '[TEST] ' : '') + b.betreff, { className: 'ko-mbetreff' }),
      A.el('div', [b.text, '', b.gruss].join('\n'), { className: 'ko-mtext' })
    ]);
    if ((st.fusszeile || []).length) box.appendChild(A.el('div', st.fusszeile.join('\n'), { className: 'ko-mfuss' }));
    return box;
  }

  /** Auswahl (für die API) aus den Briefen eines Kanals, über die Herkunft der Zeile (Person, Konto, Sollstellung). */
  function auswahlAus(briefe) {
    var o = {}, feld = { mitglied: 'mitglied_ids', konto: 'beitragskonto_ids', soll: 'sollstellung_ids' };
    briefe.forEach(function (b) {
      var q = b.quelle || { art: 'mitglied', id: b.mitglied_id };
      var k = feld[q.art];
      (o[k] = o[k] || []).push(q.id);
    });
    return o;
  }

  /** Ergebnisbericht je Empfänger nach dem Versand. */
  function berichtTabelle(bericht) {
    return A.tabelle([
      { feld: 'name', titel: 'Empfänger', wert: function (x) { return x.name || (x.anschreiben_id ? 'Schreiben ' + x.anschreiben_id : '–'); } },
      { feld: 'status', titel: 'Status' },
      { feld: 'hinweis', titel: 'Hinweis', wert: function (x) { return x.hinweis || ''; } }
    ], bericht, { sortiere: 'status', leer: 'Keine Empfänger.' });
  }

  // ------------------------------------------------------------------ Empfängerauswahl

  /**
   * Auswahl aus der Mitgliederliste (Suche/Filter, Kontrollkästchen). vorgabe: { mitglied_ids|beitragskonto_ids|sollstellung_ids }.
   * Liefert { element, auswahl() }.
   */
  function empfaengerWahl(vorgabe) {
    vorgabe = vorgabe || {};
    var huelle = A.el('div', null, { className: 'ko-auswahl' });
    var feste = ['beitragskonto_ids', 'sollstellung_ids'].filter(function (k) { return (vorgabe[k] || []).length; })[0];
    if (feste) {
      var n = vorgabe[feste].length;
      huelle.appendChild(A.el('p', n + (feste === 'sollstellung_ids' ? ' Sollstellung(en)' : ' Konto/Konten') + ' aus der vorherigen Ansicht ausgewählt.', { className: 'karte' }));
      return { element: huelle, auswahl: function () { var o = {}; o[feste] = vorgabe[feste].slice(); return o; } };
    }
    var gewaehlt = {};
    (vorgabe.mitglied_ids || []).forEach(function (id) { gewaehlt[id] = true; });
    var info = A.el('p', '', { className: 'leise' });
    function zaehle() { info.textContent = Object.keys(gewaehlt).length + ' Empfänger ausgewählt'; }
    var liste = A.daten.liste('mitglieder');
    var abt = A.daten.liste('abteilungen').map(function (a) { return { wert: a.abteilung_id, text: a.bezeichnung }; });
    var zustand = { suche: '' };
    function gefiltert() {
      var q = A.falte(zustand.suche);
      return liste.filter(function (m) {
        if (zustand.status && (m.status_abgeleitet || m.status) !== zustand.status) return false;
        if (zustand.abteilung && (m.abteilungen || []).indexOf(Number(zustand.abteilung)) < 0) return false;
        if (zustand.nur === 'gewaehlt' && !gewaehlt[m.mitglied_id]) return false;
        return !q || A.falte([m.nachname, m.vorname, m.mitgliedsnummer, m.ort].join(' ')).indexOf(q) >= 0;
      });
    }
    var leiste = A.filterleiste([
      { name: 'status', titel: 'Status', liste: ['aktiv', 'ausgetreten', 'verstorben'].map(function (s) { return { wert: s, text: s }; }), start: (vorgabe.mitglied_ids || []).length ? '' : 'aktiv' },
      { name: 'abteilung', titel: 'Abteilung', liste: abt },
      { name: 'nur', titel: 'Anzeige', liste: [{ wert: 'gewaehlt', text: 'nur ausgewählte' }], start: (vorgabe.mitglied_ids || []).length ? 'gewaehlt' : '' }
    ], function (z) { zustand = z; tab.aktualisiere(gefiltert()); }, 'Name, Nummer, Ort …');
    zustand = leiste.zustand;
    var tab = A.tabelle([
      { feld: 'wahl', titel: '✓', sortierbar: false, wert: function (m) {
        var c = A.el('input', null, { type: 'checkbox', checked: !!gewaehlt[m.mitglied_id] });
        c.setAttribute('aria-label', 'auswählen: ' + A.name(m));
        c.addEventListener('click', function (e) { e.stopPropagation(); });
        c.addEventListener('change', function () { if (c.checked) gewaehlt[m.mitglied_id] = true; else delete gewaehlt[m.mitglied_id]; zaehle(); });
        return c;
      } },
      { feld: 'nachname', titel: 'Name', wert: function (m) { return A.name(m); }, sort: function (m) { return A.name(m); } },
      { feld: 'mitgliedsnummer', titel: 'Nr.' },
      { feld: 'ort', titel: 'Ort' }
    ], gefiltert(), { sortiere: 'nachname', block: 30, leer: 'Keine Mitglieder für diese Auswahl.' });
    var knoepfe = A.el('div', null, { className: 'knopfleiste' }, [
      A.knopf('Alle angezeigten auswählen', function () { gefiltert().forEach(function (m) { gewaehlt[m.mitglied_id] = true; }); zaehle(); tab.aktualisiere(gefiltert()); }, 'zweit klein'),
      A.knopf('Auswahl leeren', function () { gewaehlt = {}; zaehle(); tab.aktualisiere(gefiltert()); }, 'zweit klein')
    ]);
    huelle.appendChild(leiste); huelle.appendChild(knoepfe); huelle.appendChild(info); huelle.appendChild(tab);
    zaehle();
    return { element: huelle, auswahl: function () { return { mitglied_ids: Object.keys(gewaehlt).map(Number) }; } };
  }

  // ------------------------------------------------------------------ Reiter: Neues Schreiben

  function reiterNeu(z, param) {
    param = param || {};
    var p = A.el('p', 'Lädt Vorlagen …', { className: 'laedt' });
    z.appendChild(p);
    Promise.all([ladeVorlagen(), ladeMailStatus()]).then(function (r) {
      var d = r[0], st = r[1];
      p.remove();
      var aktiv = d.vorlagen.filter(function (v) { return v.aktiv !== false; });
      if (!aktiv.length) { z.appendChild(A.el('p', 'Es gibt noch keine Vorlagen. Bitte unter „Vorlagen“ anlegen.', { className: 'leise' })); return; }
      var start = param.anlass ? aktiv.filter(function (v) { return v.anlass === param.anlass; })[0] : null;
      var zusatz0 = param.zusatz || {};
      var f = A.formular([
        { name: 'vorlage_id', titel: 'Vorlage', typ: 'auswahl', zahl: true, pflicht: true, liste: aktiv.map(function (v) { return { wert: v.vorlage_id, text: v.bezeichnung + ' (' + v.anlass + ')' }; }) },
        { name: 'jahr', titel: 'Beitragsjahr', typ: 'zahl' },
        { name: 'faellig_am', titel: 'Zahlungsziel', typ: 'datum', hilfe: 'Nur für Rechnung/Mahnung; leer = Briefdatum + 14 Tage' },
        { name: 'wirksam', titel: 'Wirksam ab', typ: 'datum', hilfe: 'Für {{wirksam}}, z. B. Umstellung auf Einzelbeitrag' }
      ], { vorlage_id: start ? start.vorlage_id : aktiv[0].vorlage_id, jahr: param.jahr || (A.startdaten.konfig || {}).beitragsjahr || A.startdaten.beitragsjahr,
        wirksam: zusatz0.wirksam || null });
      z.appendChild(f.element);
      if (mailMoeglich(st) && st.testmodus) z.appendChild(A.el('p', 'Testmodus: Alle E-Mails gehen nur an die Testadresse ' + (st.test_an || '') + ' (Betreff mit [TEST]).', { className: 'ko-warnung' }));
      z.appendChild(A.el('h2', 'Empfänger'));
      var wahl = empfaengerWahl(param);
      z.appendChild(wahl.element);
      var ergebnis = A.el('div');
      var kanaele = null;   // nach der Vorschau: { briefe, kanal: [ 'Brief' | 'E-Mail' ] }
      function eingaben() {
        var w = f.werte();
        if (!w.vorlage_id) { f.setzeFehler([{ feld: 'vorlage_id', meldung: 'Bitte eine Vorlage wählen.' }]); return null; }
        return { vorlage: w.vorlage_id, auswahl: wahl.auswahl(), zusatz: { jahr: w.jahr, faellig_am: w.faellig_am, wirksam: w.wirksam } };
      }
      function briefeMit(kanal) { return kanaele ? kanaele.briefe.filter(function (b, i) { return kanaele.kanal[i] === kanal; }) : []; }
      function zaehle() {
        var nBrief = kanaele ? briefeMit('Brief').length : null, nMail = briefeMit('E-Mail').length;
        erstellenKnopf.textContent = 'Erstellen & drucken' + (nBrief !== null ? ' (' + nBrief + ')' : '');
        erstellenKnopf.disabled = nBrief === 0;
        mailKnopf.textContent = 'E-Mails senden (' + nMail + ')';
        mailKnopf.disabled = !nMail;
      }
      function kanalTabelle(briefe) {
        kanaele = { briefe: briefe, kanal: briefe.map(function (b) { return mailMoeglich(st) && b.kanal === 'E-Mail' ? 'E-Mail' : 'Brief'; }) };
        if (!mailMoeglich(st)) return null;
        return A.tabelle([
          { feld: 'name', titel: 'Empfänger' },
          { feld: 'kanal', titel: 'Kanal', sortierbar: false, wert: function (b) {
            var i = briefe.indexOf(b);
            var sel = A.el('select', null, { className: 'ko-kanal' });
            sel.setAttribute('aria-label', 'Kanal für ' + b.name);
            ['Brief', 'E-Mail'].forEach(function (k) {
              var o = A.el('option', k, { value: k });
              if (k === 'E-Mail' && !b.email) o.disabled = true;
              sel.appendChild(o);
            });
            sel.value = kanaele.kanal[i];
            sel.addEventListener('click', function (e) { e.stopPropagation(); });
            sel.addEventListener('change', function () { kanaele.kanal[i] = sel.value; zaehle(); });
            return A.el('span', null, { className: 'ko-kanal' }, [sel]);
          } },
          { feld: 'kanal_hinweis', titel: 'Hinweis', wert: function (b) { return b.kanal_hinweis || (b.email ? '' : 'keine E-Mail-Adresse'); } }
        ], briefe, { sortiere: 'name', block: 30 });
      }
      var vorschauKnopf = A.knopf('Vorschau', function () {
        var e = eingaben(); if (!e) return;
        vorschauKnopf.disabled = true; A.leere(ergebnis);
        A.rufe('apiKorrespondenzVorschau', e.vorlage, e.auswahl, e.zusatz).then(function (v) {
          if (v.unbekannt.length) ergebnis.appendChild(A.el('p', 'Unbekannte Platzhalter in der Vorlage: ' + v.unbekannt.join(', ') + ' – bitte Vorlage korrigieren.', { className: 'ko-warnung' }));
          var leerNamen = Object.keys(v.leer || {});
          if (leerNamen.length) ergebnis.appendChild(A.el('p', 'Hinweis: Diese Angaben sind bei einigen Empfängern leer: ' + leerNamen.join(', '), { className: 'ko-warnung' }));
          var t = kanalTabelle(v.briefe);
          if (t) { ergebnis.appendChild(A.el('h3', 'Kanal je Empfänger')); ergebnis.appendChild(t); }
          zaehle();
          ergebnis.appendChild(A.el('p', v.briefe.length + ' Schreiben. Vorschau der ersten ' + Math.min(3, v.briefe.length) + ':', { className: 'leise' }));
          v.briefe.slice(0, 3).forEach(function (b) { ergebnis.appendChild(briefKarte(b)); });
          var ersteMail = v.briefe.filter(function (b, i) { return kanaele.kanal[i] === 'E-Mail'; })[0];
          if (ersteMail) { ergebnis.appendChild(A.el('h3', 'So sieht die E-Mail aus')); ergebnis.appendChild(mailVorschau(ersteMail, st)); }
        }, function () {}).then(function () { vorschauKnopf.disabled = false; });
      }, 'zweit');
      var erstellenKnopf = A.knopf('Erstellen & drucken', function () {
        var e = eingaben(); if (!e) return;
        if (kanaele) { e.auswahl = auswahlAus(briefeMit('Brief')); e.zusatz.kanal = 'Brief'; }
        erstellenKnopf.disabled = true;
        A.rufe('apiKorrespondenzErstellen', e.vorlage, e.auswahl, e.zusatz).then(function (d2) {
          A.daten.uebernehme(d2);
          ergebnis.appendChild(A.el('p', d2.briefe.length + ' Schreiben erstellt und unter „Erstellte Schreiben“ abgelegt.', { className: 'karte' }));
          ergebnis.appendChild(A.knopf('Erneut drucken', function () { drucke(d2.briefe, 'Schreiben'); }, 'zweit'));
          drucke(d2.briefe, 'Schreiben');
        }, function () {}).then(function () { erstellenKnopf.disabled = false; });
      });
      var mailKnopf = A.knopf('E-Mails senden (0)', function () {
        var e = eingaben(); if (!e) return;
        var liste = briefeMit('E-Mail');
        if (!liste.length) return;
        var text = liste.length + ' E-Mail(s) jetzt senden?' + (st.testmodus ? ' TESTMODUS: Alle gehen an ' + (st.test_an || 'die Testadresse') + '.' : ' Die Mails gehen sofort an die Empfänger.');
        A.bestaetige('E-Mails senden', text, 'Senden').then(function (ja) {

      var doks = A.daten.liste('dokumente').filter(function (d) { return d.beitragskonto_id === k.beitragskonto_id; });
      var mandat = doks.filter(function (d) { return d.art === 'SEPA-Mandat'; });
      box.appendChild(A.abschnitt('SEPA-Mandat & Dokumente', [A.knopf('Dokument verknüpfen', function () {
        dokumentDialog({ beitragskonto_id: k.beitragskonto_id, mitglied_id: k.kontoinhaber_mitglied_id || null, art: 'SEPA-Mandat', titel: 'SEPA-Mandat ' + (k.mandatsreferenz || '') });
      }, 'zweit klein')]));
      if (k.zahlweg === 'Lastschrift' && !mandat.length) {
        box.appendChild(A.el('p', 'Zu diesem Lastschrift-Konto ist kein unterschriebenes SEPA-Mandat verknüpft. Bei einem Widerspruch ist das Mandat der Nachweis.', { className: 'ko-warnung' }));
      }
      if (doks.length) box.appendChild(dokumentListe(mandat.concat(doks.filter(function (d) { return d.art !== 'SEPA-Mandat'; }))));
      var briefe = A.daten.liste('anschreiben').filter(function (a) { return a.beitragskonto_id === k.beitragskonto_id; });
      if (briefe.length) { box.appendChild(A.el('h3', 'Schreiben zu diesem Konto')); box.appendChild(anschreibenTabelle(briefe, true)); }
      if (A.darf('anschreiben_erstellen')) {
        box.appendChild(A.el('div', null, { className: 'knopfleiste' }, [
          A.knopf('Rechnung', function () { A.zeige('korrespondenz', { beitragskonto_ids: [k.beitragskonto_id], anlass: 'Rechnung' }); }, 'zweit klein'),
          A.knopf('Mahnung', function () { A.zeige('korrespondenz', { beitragskonto_ids: [k.beitragskonto_id], anlass: 'Mahnung' }); }, 'zweit klein'),
          A.knopf('SEPA-Vorabinformation', function () { A.zeige('korrespondenz', { beitragskonto_ids: [k.beitragskonto_id], anlass: 'SEPA-Vorabinformation' }); }, 'zweit klein')
        ]));
      }
    });
    return null;
  });
})();
</script>
