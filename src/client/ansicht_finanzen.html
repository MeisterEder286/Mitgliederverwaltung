<!--
  ansicht_finanzen – Beitragskonten, Gemeinschaften, Einzugsstand, Sollstellungen, SEPA-Lauf, Klärliste, Tarifwechsel,
                     Beitragsänderung.

  Zweck:      Arbeitsbereich für Kasse und Mitgliederverwaltung (MV-Mockup: Beitragskonten, Einzugsstand 2026, SEPA-Lauf).
              Zwei Ansichten: 'finanzen' (Reiter) und 'konto' ({ id }, Detail eines Beitragskontos).
  Datenquelle: Listen konten, gemeinschaften, sollstellungen aus dem Snapshot-Bereich „finanzen“ (App.daten.lade);
              berechnete Werte (Soll je Konto, Mandatsstatus, Klärliste, Probeläufe) über apiFinanzen…-Funktionen.
              IBAN im Klartext nur über „aufdecken“ (apiFinanzenIbanAufdecken, wird protokolliert, nach 60 s verborgen).
  Wer darf:   Ansicht: konto_lesen (Vorstand, Mitgliederverwalter, Kassier). Bearbeiten von Konten/Gemeinschaften:
              konto_bearbeiten (nicht der Kassier). Buchen: sollstellung_bearbeiten. SEPA: sepa_lauf. Tarifwechsel
              übernehmen: mitglied_bearbeiten. Beitragsänderung übernehmen: stammdaten_bearbeiten. Export: export. Alles serverseitig erzwungen; App.darf blendet nur aus.
  Besonderheiten:
    - Die SEPA-Datei entsteht auf dem Server (pain.008.001.08) und wird hier nur heruntergeladen – vor dem ersten
      echten Einsatz einmal bei der Hausbank als Testdatei einreichen.
    - Exporte aus dem Browser (Mahnliste, Kontenliste, Kontrollliste) werden über apiFinanzenExportVermerken protokolliert.
-->
<style>
  .fin-zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .fin-zeile select, .fin-zeile input { min-height: 44px; padding: 6px 10px; border: 1px solid var(--rand); border-radius: var(--radius); font: inherit; }
  .fin-summe { font-weight: 600; margin: 6px 0 12px; }
  .fin-iban { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .fin-hinweis { background: #fff6dc; color: #5c4400; border-radius: var(--radius); padding: 10px 12px; margin: 0 0 12px; }
  .fin-fehlerbox { background: var(--fehler-grund); color: var(--fehler-text); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 12px; }
  .fin-ok { color: #135c2c; font-weight: 600; }
  .fin-schlecht { color: var(--fehler-text); font-weight: 600; }
  .fin-link { background: none; border: 0; padding: 0; color: var(--akzent); text-decoration: underline; cursor: pointer; font: inherit; text-align: left; }
  .fin-check { width: 22px; height: 22px; }
</style>
<script>
(function () {
  'use strict';
  var A = window.App;

  var ERLAUBT = {   // wie Sollstellungslauf.ERLAUBT (src/lib/sollstellung.js) – nur zur Auswahl im Dialog
    offen: ['bezahlt', 'ruecklastschrift', 'gemahnt', 'widerspruch', 'storniert'],
    bezahlt: ['ruecklastschrift', 'widerspruch', 'storniert'],
    ruecklastschrift: ['bezahlt', 'gemahnt', 'widerspruch', 'storniert'],
    gemahnt: ['bezahlt', 'gemahnt', 'ruecklastschrift', 'widerspruch', 'storniert'],
    widerspruch: ['bezahlt', 'gemahnt', 'storniert'],
    storniert: []
  };
  var STATUSTEXT = { offen: 'offen', bezahlt: 'bezahlt', gemahnt: 'gemahnt', ruecklastschrift: 'Rücklastschrift', widerspruch: 'Widerspruch', storniert: 'storniert' };
  var MANDATTEXT = { gueltig: 'gültig', ungenutzt: 'noch nicht genutzt', verfallen: 'verfallen', fehlt: 'fehlt', kein: '–' };

  var zustand = { reiter: 'uebersicht', jahr: null, info: null, infoJahr: null };

  // ------------------------------------------------------------------ Hilfen

  function jahrStandard() {
    var k = (A.startdaten && A.startdaten.konfig) || {};
    return Number(k.beitragsjahr || A.startdaten.beitragsjahr) || new Date().getFullYear();
  }
  function jahr() { return zustand.jahr || jahrStandard(); }

  function info(neu) {
    if (!neu && zustand.info && zustand.infoJahr === jahr()) return Promise.resolve(zustand.info);
    var j = jahr();
    return A.rufe('apiFinanzenUebersicht', j).then(function (d) { zustand.info = d; zustand.infoJahr = j; return d; });
  }
  function infoVerwerfen() { zustand.info = null; }

  function personenJeKonto() {
    var m = {};
    A.daten.liste('mitglieder').forEach(function (p) { if (p.beitragskonto_id) (m[p.beitragskonto_id] = m[p.beitragskonto_id] || []).push(p); });
    return m;
  }
  function mitgliedNachNummer(nr) {
    nr = String(nr || '').trim();
    if (!nr) return null;
    var ziel = nr.replace(/^0+/, '');
    return A.daten.liste('mitglieder').filter(function (m) { return String(m.mitgliedsnummer || '').replace(/^0+/, '') === ziel; })[0] || null;
  }
  function personLink(m) {
    if (!m) return '–';
    return A.el('button', A.name(m) + (m.mitgliedsnummer ? ' (' + m.mitgliedsnummer + ')' : ''), { type: 'button', className: 'fin-link', onclick: function (e) { e.stopPropagation(); A.zeige('mitglied', { id: m.mitglied_id }); } });
  }
  function kontoLink(id) {
    if (!id) return '–';
    var k = A.daten.hole('konten', id);
    return A.el('button', 'Konto ' + id + (k ? ' · ' + k.kontoinhaber_name : ''), { type: 'button', className: 'fin-link', onclick: function (e) { e.stopPropagation(); A.zeige('konto', { id: id }); } });
  }
  function jahreAusDaten() {
    var j = {};
    j[jahrStandard()] = true; j[jahrStandard() + 1] = true;
    A.daten.liste('sollstellungen').forEach(function (s) { j[s.jahr] = true; });
    if (zustand.info) (zustand.info.jahre || []).forEach(function (x) { j[x] = true; });
    return Object.keys(j).map(Number).sort(function (a, b) { return b - a; });
  }
  function jahrAuswahl(beiWechsel) {
    var s = A.el('select', null, { aria: { label: 'Beitragsjahr' } });
    jahreAusDaten().forEach(function (j) { s.appendChild(A.el('option', 'Beitragsjahr ' + j, { value: String(j) })); });
    s.value = String(jahr());
    s.addEventListener('change', function () { zustand.jahr = Number(s.value); beiWechsel(); });
    return s;
  }
  function laedt(ziel) { ziel.appendChild(A.el('p', 'Lädt …', { className: 'laedt' })); }
  function exportVermerken(liste, anzahl) { A.rufe('apiFinanzenExportVermerken', liste, anzahl, A.still).catch(function () {}); }
  /** Nach dem Speichern: Ansicht neu zeichnen (blendet Meldungen aus) und DANACH Erfolg bzw. Hinweise melden. */
  function fertig(text, d) {
    A.neuZeichnen();
    if (d && d.hinweise && d.hinweise.length) A.meldung(text + ' ' + d.hinweise.join(' '), 'hinweis');
    else A.meldung(text, 'ok');
  }

  /** Kleine IBAN-Prüfung im Browser (mod 97) – nur zur Rückmeldung beim Tippen; der Server prüft verbindlich. */
  function ibanGueltig(text) {
    var s = String(text || '').replace(/[\s\-.]/g, '').toUpperCase();
    if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
    if (s.slice(0, 2) === 'DE' && s.length !== 22) return false;
    var u = s.slice(4) + s.slice(0, 4), rest = 0;
    for (var i = 0; i < u.length; i++) {
      var c = u.charCodeAt(i), z = c >= 65 ? String(c - 55) : u.charAt(i);
      for (var j = 0; j < z.length; j++) rest = (rest * 10 + Number(z.charAt(j))) % 97;
    }
    return rest === 1;
  }

  // ================================================================== Ansicht „finanzen“

  var REITER = [
    { k: 'uebersicht', t: 'Einzugsstand' },
    { k: 'konten', t: 'Konten' },
    { k: 'gemeinschaften', t: 'Gemeinschaften' },
    { k: 'sollstellungen', t: 'Sollstellungen' },
    { k: 'sepa', t: 'SEPA-Lauf', aktion: 'sepa_lauf' },
    { k: 'rechnungen', t: 'Rechnungen' },
    { k: 'jahre', t: 'Jahresübersicht' },
    { k: 'klaerliste', t: 'Klärliste' },
    { k: 'tarifwechsel', t: 'Tarifwechsel' },
    { k: 'beitragsaenderung', t: 'Beitragsänderung' }
  ];

  A.registriere('finanzen', {
    titel: 'Finanzen', aktion: 'konto_lesen', reihenfolge: 30,
    zeichne: function (ziel, param) {
      if (param && param.reiter) zustand.reiter = param.reiter;
      ziel.appendChild(A.el('h1', 'Finanzen'));
      var leiste = A.el('div', null, { className: 'reiter', role: 'tablist' });
      var bereich = A.el('div', null, { role: 'tabpanel' });
      REITER.filter(function (r) { return !r.aktion || A.darf(r.aktion); }).forEach(function (r) {
        var b = A.el('button', r.t, { type: 'button', role: 'tab', onclick: function () { zustand.reiter = r.k; A.neuZeichnen(); } });
        b.setAttribute('aria-selected', zustand.reiter === r.k ? 'true' : 'false');
        leiste.appendChild(b);
      });
      ziel.appendChild(leiste);
      ziel.appendChild(bereich);
      laedt(bereich);
      A.daten.lade('finanzen').then(function () {
        A.leere(bereich);
        var f = { uebersicht: zeigeUebersicht, konten: zeigeKonten, gemeinschaften: zeigeGemeinschaften, sollstellungen: zeigeSollstellungen,
          sepa: zeigeSepa, klaerliste: zeigeKlaerliste, tarifwechsel: zeigeTarifwechsel, beitragsaenderung: zeigeBeitragsaenderung,
          rechnungen: zeigeRechnungen, jahre: zeigeJahre }[zustand.reiter] || zeigeUebersicht;
        f(bereich);
      }).catch(function () { A.leere(bereich); bereich.appendChild(A.el('p', 'Die Finanzdaten konnten nicht geladen werden.', { className: 'leise' })); });
    }
  });

  // ------------------------------------------------------------------ Einzugsstand

  function zeigeUebersicht(ziel) {
    var kopf = A.el('div', null, { className: 'fin-zeile' }, [jahrAuswahl(A.neuZeichnen)]);
    if (A.darf('export')) kopf.appendChild(A.knopf('Buchhaltungs-Export (CSV)', buchhaltungExport, 'zweit'));
    ziel.appendChild(kopf);
    var inhalt = A.el('div');
    ziel.appendChild(inhalt);
    laedt(inhalt);
    info().then(function (d) {
      A.leere(inhalt);
      var e = d.einzugsstand;
      var kacheln = A.el('div', null, { className: 'kacheln' }, [
        A.kachel(A.zahl(e.anzahl), 'Sollstellungen ' + d.jahr),
        A.kachel(A.betrag(e.soll_gesamt), 'Soll gesamt'),
        A.kachel(A.betrag(e.ist_gesamt), 'eingegangen'),
        A.kachel(A.zahl(e.offen), 'offen (' + A.betrag(e.offen_betrag) + ')', e.offen ? 'warnung' : ''),
        A.kachel(A.zahl(e.ruecklastschriften), 'Rücklastschriften', e.ruecklastschriften ? 'fehler' : ''),
        A.kachel(A.zahl(e.gemahnt), 'gemahnt', e.gemahnt ? 'warnung' : ''),
        A.kachel(A.zahl(e.ohne_mandat), 'ohne gültiges Mandat', e.ohne_mandat ? 'fehler' : '', function () { zustand.reiter = 'konten'; zustand.kontenFilter = { mandat: 'problem' }; A.neuZeichnen(); }),
        A.kachel(A.zahl(d.klaerliste.fehler), 'Klärliste: Fehler', d.klaerliste.fehler ? 'fehler' : '', function () { zustand.reiter = 'klaerliste'; A.neuZeichnen(); })
      ]);
      inhalt.appendChild(kacheln);
      var streitig = A.daten.liste('sollstellungen').filter(function (s) {
        return s.jahr === d.jahr && ['ruecklastschrift', 'gemahnt', 'widerspruch', 'offen'].indexOf(s.status) >= 0;
      });
      var summe = streitig.reduce(function (n, s) { return n + Math.max(0, Number(s.soll_betrag || 0) + Number(s.gebuehr || 0) - Number(s.ist_betrag || 0)); }, 0);
      var knoepfe = [];
      if (A.darf('export')) {
        knoepfe.push(A.knopf('Mahnliste CSV', function () { mahnlisteExport(streitig, d.jahr, 'csv'); }, 'zweit klein'));
        knoepfe.push(A.knopf('Drucken', function () { mahnlisteExport(streitig, d.jahr, 'druck'); }, 'zweit klein'));
      }
      if (A.darf('anschreiben_erstellen') && streitig.length) {
        // Mahnungen als Schreiben (Vorlage „Mahnung“) – Übergabe an die Ansicht „Schreiben“
        knoepfe.push(A.knopf('Mahnungen erstellen', function () {
          A.zeige('korrespondenz', { anlass: 'Mahnung', jahr: d.jahr, sollstellung_ids: streitig.map(function (x) { return x.sollstellung_id; }) });
        }, 'zweit klein'));
      }
      inhalt.appendChild(A.abschnitt('Offen und streitig ' + d.jahr, knoepfe));
      inhalt.appendChild(A.el('p', 'Summe offen/streitig: ' + A.betrag(summe), { className: 'fin-summe' }));
      inhalt.appendChild(sollTabelle(streitig, { sortiere: 'status' }));
    }).catch(function () { A.leere(inhalt); });
  }

  function mahnSpalten() {
    return [
      { titel: 'Konto', wert: function (s) { return s.beitragskonto_id; } },
      { titel: 'Inhaber', wert: function (s) { var k = A.daten.hole('konten', s.beitragskonto_id); return k ? k.kontoinhaber_name : ''; } },
      { titel: 'Soll', wert: function (s) { return A.betrag(s.soll_betrag); } },
      { titel: 'Gebühr', wert: function (s) { return s.gebuehr ? A.betrag(s.gebuehr) : ''; } },
      { titel: 'Status', wert: function (s) { return STATUSTEXT[s.status] || s.status; } },
      { titel: 'Mahnstufe', wert: function (s) { return s.mahnstufe || 0; } },
      { titel: 'Grund', wert: function (s) { return s.ruecklastschrift_grund || ''; } }
    ];
  }
  function mahnlisteExport(liste, j, art) {
    if (art === 'csv') A.csv('Mahnliste_' + j + '.csv', mahnSpalten(), liste);
    else A.drucke('Mahnliste ' + j, mahnSpalten(), liste, 'Offene und streitige Beiträge');
    exportVermerken('Mahnliste ' + j, liste.length);
  }
  function buchhaltungExport() {
    var j = jahr();
    A.rufe('apiFinanzenBuchhaltung', j).then(function (d) {
      A.csv('Beitraege_' + j + '_Buchhaltung.csv', [
        { titel: 'Sollstellung', feld: 'sollstellung_id' }, { titel: 'Konto', feld: 'konto' }, { titel: 'Inhaber', feld: 'inhaber' },
        { titel: 'Zahlweg', feld: 'zahlweg' }, { titel: 'Mandatsreferenz', feld: 'mandatsreferenz' },
        { titel: 'Soll', wert: function (z) { return z.soll === null ? '' : String(z.soll).replace('.', ','); } },
        { titel: 'Ist', wert: function (z) { return z.ist === null ? '' : String(z.ist).replace('.', ','); } },
        { titel: 'Gebühr', wert: function (z) { return z.gebuehr === null ? '' : String(z.gebuehr).replace('.', ','); } },
        { titel: 'Status', feld: 'status' }, { titel: 'Sequenz', feld: 'sequenz' },
        { titel: 'Einzug', wert: function (z) { return z.einzugsdatum ? A.datum(z.einzugsdatum) : ''; } },
        { titel: 'Buchung', wert: function (z) { return z.buchungsdatum ? A.datum(z.buchungsdatum) : ''; } },
        { titel: 'Mahnstufe', feld: 'mahnstufe' }, { titel: 'Grund', feld: 'grund' }
      ], d.zeilen);
    }).catch(function () {});
  }

  // ------------------------------------------------------------------ Sollstellungstabelle (gemeinsam)

  function sollTabelle(liste, optionen) {
    optionen = optionen || {};
    var spalten = [];
    if (!optionen.ohneKonto) {
      spalten.push({ feld: 'beitragskonto_id', titel: 'Konto', zahl: true });
      spalten.push({ feld: 'inhaber', titel: 'Inhaber', wert: function (s) { var k = A.daten.hole('konten', s.beitragskonto_id); return k ? k.kontoinhaber_name : '–'; },
        sort: function (s) { var k = A.daten.hole('konten', s.beitragskonto_id); return k ? k.kontoinhaber_name : ''; } });
    } else {
      spalten.push({ feld: 'jahr', titel: 'Jahr', zahl: true });
    }
    spalten.push({ feld: 'soll_betrag', titel: 'Soll', zahl: true, wert: function (s) { return A.betrag(s.soll_betrag); } });
    spalten.push({ feld: 'ist_betrag', titel: 'Ist', zahl: true, wert: function (s) { return s.ist_betrag === undefined ? '–' : A.betrag(s.ist_betrag); } });
    spalten.push({ feld: 'status', titel: 'Status', wert: function (s) { return STATUSTEXT[s.status] || s.status; } });
    spalten.push({ feld: 'sepa_sequenz', titel: 'Seq.' });
    spalten.push({ feld: 'einzugsdatum', titel: 'Einzug', wert: function (s) { return A.datum(s.einzugsdatum); } });
    spalten.push({ feld: 'mahnstufe', titel: 'Mahnst.', zahl: true });
    spalten.push({ feld: 'ruecklastschrift_grund', titel: 'Grund' });
    return A.tabelle(spalten, liste, {
      sortiere: optionen.sortiere || (optionen.ohneKonto ? 'jahr' : 'beitragskonto_id'), absteigend: !!optionen.ohneKonto,
      beiKlick: A.darf('sollstellung_bearbeiten') ? statusDialog : null, leer: 'Keine Sollstellungen.'
    });
  }

  function statusDialog(s) {
    var arten = ERLAUBT[s.status || 'offen'] || [];
    if (!arten.length) { A.meldung('Diese Sollstellung ist storniert und kann nicht mehr geändert werden.', 'hinweis'); return; }
    var k = A.daten.hole('konten', s.beitragskonto_id);
    var inhalt = A.el('div');
    inhalt.appendChild(A.details([
      ['Konto', (s.beitragskonto_id || '') + (k ? ' · ' + k.kontoinhaber_name : '')], ['Jahr', s.jahr],
      ['Soll', A.betrag(s.soll_betrag)], ['Status', STATUSTEXT[s.status]], ['Mahnstufe', s.mahnstufe || 0],
      ['Zusammensetzung', s.bemerkung || '–']
    ]));
    var form = A.formular([
      { name: 'art', titel: 'Neuer Status', typ: 'auswahl', pflicht: true, liste: arten.map(function (a) { return { wert: a, text: STATUSTEXT[a] }; }) },
      { name: 'datum', titel: 'Datum', typ: 'datum', hilfe: 'Buchungs- bzw. Rückgabedatum' },
      { name: 'grund', titel: 'Grund', typ: 'text', hilfe: 'Pflicht bei Rücklastschrift und Storno' },
      { name: 'betrag', titel: 'Eingegangener Betrag', typ: 'betrag', hilfe: 'Leer = Soll + Gebühren' },
      { name: 'gebuehr', titel: 'Gebühr', typ: 'betrag', hilfe: 'Leer = Standardgebühr bei Rücklastschrift' }
    ], { art: arten[0], datum: A.heute() });
    inhalt.appendChild(form.element);
    A.dialog('Zahlungsstatus buchen', inhalt, [
      { text: 'Abbrechen' },
      { text: 'Buchen', art: '', aktion: function (schliessen) {
        var w = form.werte();
        if (!w.art) { form.setzeFehler([{ feld: 'art', meldung: 'Bitte einen Status wählen.' }]); return; }
        A.rufe('apiFinanzenSollstellungStatus', s.sollstellung_id, s.version, w).then(function (d) {
          A.daten.uebernehme(d); infoVerwerfen(); schliessen(); fertig('Gebucht.');
        }, function (err) { if (err.felder) form.setzeFehler(err.felder); if (err.art === 'konflikt') { schliessen(); A.ladeNeu(); } });
      } }
    ]);
  }

  // ------------------------------------------------------------------ Konten

  function zeigeKonten(ziel) {
    var knoepfe = [];
    if (A.darf('konto_bearbeiten')) knoepfe.push(A.knopf('Konto anlegen', function () { kontoFormular(null); }));
    if (A.darf('export')) knoepfe.push(A.knopf('Kontenliste CSV', function () { kontenExport(); }, 'zweit'));
    ziel.appendChild(A.el('div', null, { className: 'fin-zeile' }, [jahrAuswahl(A.neuZeichnen)].concat(knoepfe)));
    var huelle = A.el('div');
    ziel.appendChild(huelle);
    laedt(huelle);
    info().then(function (d) {
      A.leere(huelle);
      var pj = personenJeKonto();
      var start = zustand.kontenFilter || {};
      zustand.kontenFilter = null;
      var leiste = A.filterleiste([
        { name: 'zahlweg', titel: 'Zahlweg', liste: (A.startdaten.listen.zahlweg || []).map(function (z) { return { wert: z, text: z }; }) },
        { name: 'mandat', titel: 'Mandat', start: start.mandat, liste: [
          { wert: 'problem', text: 'fehlt oder verfallen' }, { wert: 'gueltig', text: 'gültig' }, { wert: 'ungenutzt', text: 'noch nicht genutzt' }] },
        { name: 'probleme', titel: 'Klärliste', liste: [{ wert: 'ja', text: 'mit Klärfall' }] },
        { name: 'aktiv', titel: 'Status', start: 'ja', liste: [{ wert: 'ja', text: 'aktive Konten' }, { wert: 'nein', text: 'stillgelegt' }] }
      ], filtern, 'Inhaber, Konto, Mandat, Person …');
      huelle.appendChild(leiste);
      function zeilen(z) {
        var such = A.falte(z.suche || '');
        return A.daten.liste('konten').filter(function (k) {
          var i = d.konten[k.beitragskonto_id] || {};
          if (z.zahlweg && k.zahlweg !== z.zahlweg) return false;
          if (z.aktiv === 'ja' && k.aktiv === false) return false;
          if (z.aktiv === 'nein' && k.aktiv !== false) return false;
          if (z.mandat === 'problem' && !(k.zahlweg === 'Lastschrift' && (i.mandat === 'fehlt' || i.mandat === 'verfallen'))) return false;
          if (z.mandat && z.mandat !== 'problem' && i.mandat !== z.mandat) return false;
          if (z.probleme === 'ja' && !i.probleme) return false;
          if (!such) return true;
          var text = [k.beitragskonto_id, k.kontoinhaber_name, k.mandatsreferenz].concat((pj[k.beitragskonto_id] || []).map(function (m) { return A.name(m) + ' ' + m.mitgliedsnummer; })).join(' ');
          return A.falte(text).indexOf(such) >= 0;
        });
      }

  // ------------------------------------------------------------------ Tarifwechsel

  function zeigeTarifwechsel(ziel) {
    // eigener Jahreswert: Tarifwechsel betreffen meist das kommende Beitragsjahr
    if (!zustand.twJahr) zustand.twJahr = jahrStandard() + 1;
    var sel = A.el('select', null, { aria: { label: 'Stichtagsjahr' } });
    [jahrStandard(), jahrStandard() + 1].forEach(function (j) { sel.appendChild(A.el('option', 'Stichtag 01.01.' + j, { value: String(j) })); });
    sel.value = String(zustand.twJahr);
    sel.addEventListener('change', function () { zustand.twJahr = Number(sel.value); A.neuZeichnen(); });
    ziel.appendChild(A.el('div', null, { className: 'fin-zeile' }, [sel]));
    ziel.appendChild(A.el('p', 'Vorschläge, wenn das Alter zum Stichtag nicht mehr zur Beitragsart passt (Altersgrenzen der Beitragsarten). Übernehmen ändert die Beitragsart der ausgewählten Personen.', { className: 'leise' }));
    var huelle = A.el('div');
    ziel.appendChild(huelle);
    laedt(huelle);
    A.rufe('apiFinanzenTarifwechsel', zustand.twJahr).then(function (liste) {
      A.leere(huelle);
      var gewaehlt = {};
      liste.forEach(function (v) { if (v.nach) gewaehlt[v.mitglied_id] = true; });
      var spalten = [];
      if (A.darf('mitglied_bearbeiten')) spalten.push({ feld: 'wahl', titel: '', sortierbar: false, wert: function (v) {
        if (!v.nach) return '';
        var c = A.el('input', null, { type: 'checkbox', className: 'fin-check', checked: !!gewaehlt[v.mitglied_id] });
        c.setAttribute('aria-label', 'Übernehmen: ' + v.name);
        c.addEventListener('click', function (e) { e.stopPropagation(); gewaehlt[v.mitglied_id] = c.checked; });
        return c;
      } });
      spalten = spalten.concat([
        { feld: 'name', titel: 'Name', wert: function (v) { var m = A.daten.hole('mitglieder', v.mitglied_id); return m ? personLink(m) : v.name; }, sort: function (v) { return v.name; } },
        { feld: 'alter', titel: 'Alter', zahl: true },
        { feld: 'von_bezeichnung', titel: 'bisher' },
        { feld: 'nach_bezeichnung', titel: 'neu', wert: function (v) { return v.nach_bezeichnung || 'keine passende Beitragsart'; } }
      ]);
      huelle.appendChild(A.tabelle(spalten, liste, { sortiere: 'name', leer: 'Keine Tarifwechsel nötig.' }));
      if (liste.length && A.darf('mitglied_bearbeiten')) {
        huelle.appendChild(A.knopf('Ausgewählte übernehmen', function () {
          var ids = Object.keys(gewaehlt).filter(function (k) { return gewaehlt[k]; }).map(Number);
          if (!ids.length) { A.meldung('Bitte mindestens einen Vorschlag auswählen.', 'hinweis'); return; }
          A.rufe('apiFinanzenTarifwechselUebernehmen', zustand.twJahr, ids).then(function (r) {
            A.daten.uebernehme(r); infoVerwerfen(); fertig(r.anzahl + ' Tarifwechsel übernommen.');
          }, function () {});
        }));
      }
    }).catch(function () { A.leere(huelle); });
  }

  // ------------------------------------------------------------------ Beitragsänderung (z. B. nach JHV-Beschluss)

  /**
   * Neue Beträge je Beitragsart und je Pauschale ab 01.01. eines künftigen Jahres: Vorschau je Konto, Übernahme
   * (alte Beträge bleiben für frühere Jahre erhalten), danach Vorabinformation über „Schreiben“ (je 500 Konten).
   */
  function zeigeBeitragsaenderung(ziel) {
    if (!zustand.baJahr) zustand.baJahr = jahrStandard() + 1;
    var sel = A.el('select', null, { aria: { label: 'Gültig ab' } });
    [jahrStandard() + 1, jahrStandard() + 2].forEach(function (j) { sel.appendChild(A.el('option', 'gültig ab 01.01.' + j, { value: String(j) })); });
    sel.value = String(zustand.baJahr);
    sel.addEventListener('change', function () { zustand.baJahr = Number(sel.value); zustand.baErgebnis = null; A.neuZeichnen(); });
    ziel.appendChild(A.el('div', null, { className: 'fin-zeile' }, [sel]));

    if (zustand.baErgebnis && zustand.baErgebnis.jahr === zustand.baJahr) { baUebernommen(ziel, zustand.baErgebnis); return; }

    ziel.appendChild(A.el('p', 'Neue Beträge eintragen und die Vorschau berechnen. Die bisherigen Beträge bleiben für frühere Jahre (Nachlauf, Rechnungen) erhalten. Nur für ein Jahr ohne Sollstellungen möglich.', { className: 'leise' }));
    // Eingabefelder einmal je Zeile – die Tabelle zeichnet beim Sortieren neu, die Werte bleiben erhalten
    var felder = { arten: {}, festbetraege: {} };
    function betragFeld(wert, label) {
      var i = A.el('input', null, { type: 'number', min: '0', step: '0.01', value: String(wert), inputMode: 'decimal' });
      i.setAttribute('aria-label', label);
      i.style.width = '8em';
      return i;
    }
    var arten = A.daten.liste('beitragsarten').filter(function (a) { return a.aktiv !== false; });
    ziel.appendChild(A.el('h2', 'Beitragsarten'));
    ziel.appendChild(A.tabelle([
      { feld: 'bezeichnung', titel: 'Beitragsart' },
      { feld: 'betrag', titel: 'bisher', zahl: true, wert: function (a) { return A.betrag(a.betrag); } },
      { titel: 'neu', sortierbar: false, wert: function (a) {
        return felder.arten[a.beitragsart_id] = felder.arten[a.beitragsart_id] || betragFeld(a.betrag, 'Neuer Betrag ' + a.bezeichnung);
      } }
    ], arten, { sortiere: 'bezeichnung', leer: 'Keine aktiven Beitragsarten.' }));

    var pauschalen = {};
    A.daten.liste('gemeinschaften').forEach(function (g) {
      if (g.aktiv === false || g.festbetrag === null || g.festbetrag === undefined || g.festbetrag === '') return;
      var b = Number(g.festbetrag);
      pauschalen[b] = (pauschalen[b] || 0) + 1;
    });
    var pListe = Object.keys(pauschalen).map(function (b) { return { betrag: Number(b), anzahl: pauschalen[b] }; });
    if (pListe.length) {
      ziel.appendChild(A.el('h2', 'Pauschalen der Gemeinschaften'));
      ziel.appendChild(A.tabelle([
        { feld: 'betrag', titel: 'bisher', zahl: true, wert: function (p) { return A.betrag(p.betrag); } },
        { feld: 'anzahl', titel: 'Gemeinschaften', zahl: true },
        { titel: 'neu', sortierbar: false, wert: function (p) {
          return felder.festbetraege[p.betrag] = felder.festbetraege[p.betrag] || betragFeld(p.betrag, 'Neue Pauschale statt ' + A.betrag(p.betrag));
        } }
      ], pListe, { sortiere: 'betrag' }));
    }

    var vorschau = A.el('div');
    function eingabe() {
      return {
        arten: Object.keys(felder.arten).map(function (id) { var f = felder.arten[id]; return { beitragsart_id: Number(id), betrag: f.value === '' ? null : Number(f.value) }; }),
        festbetraege: Object.keys(felder.festbetraege).map(function (b) { var f = felder.festbetraege[b]; return { alt: Number(b), neu: f.value === '' ? null : Number(f.value) }; })
      };
    }
    ziel.appendChild(A.el('div', null, { className: 'fin-zeile' }, [A.knopf('Vorschau berechnen', function () {
      var e = eingabe();
      A.leere(vorschau); laedt(vorschau);
      A.rufe('apiFinanzenBeitragsaenderungVorschau', zustand.baJahr, e).then(function (r) { baVorschau(vorschau, r, e); }, function () { A.leere(vorschau); });
    })]));
    ziel.appendChild(vorschau);
  }

  function baKonten(r) {
    return A.tabelle([
      { feld: 'beitragskonto_id', titel: 'Konto', zahl: true, wert: function (k) { return kontoLink(k.beitragskonto_id); }, sort: function (k) { return k.beitragskonto_id; } },
      { feld: 'inhaber', titel: 'Zahler' }, { feld: 'zahlweg', titel: 'Zahlweg' },
      { feld: 'alt', titel: 'bisher', zahl: true, wert: function (k) { return A.betrag(k.alt); } },
      { feld: 'neu', titel: 'neu', zahl: true, wert: function (k) { return A.betrag(k.neu); } },
      { feld: 'differenz', titel: 'Differenz', zahl: true, wert: function (k) { return A.betrag(k.differenz); } }
    ], r.konten, { block: 25, sortiere: 'inhaber', leer: 'Kein Konto ändert sich.' });
  }

  function baKacheln(r) {
    return A.el('div', null, { className: 'kacheln' }, [
      A.kachel(A.zahl(r.konten.length), 'Konten mit neuem Beitrag'),
      A.kachel(A.betrag(r.summe_alt), 'Jahressoll bisher'),
      A.kachel(A.betrag(r.summe_neu), 'Jahressoll neu')
    ]);
  }

  function baVorschau(ziel, r, e) {
    A.leere(ziel);
    if (r.fehler.length) { ziel.appendChild(A.el('div', r.fehler.join(' '), { className: 'fin-fehlerbox', role: 'alert' })); return; }
    if (!r.arten.length && !r.gemeinschaften.length) { ziel.appendChild(A.el('p', 'Es ändert sich kein Betrag.', { className: 'leise' })); return; }
    ziel.appendChild(baKacheln(r));
    var aenderung = r.arten.map(function (a) { return a.bezeichnung + ': ' + A.betrag(a.alt) + ' → ' + A.betrag(a.neu); });
    if (r.gemeinschaften.length) aenderung.push(r.gemeinschaften.length + ' Pauschale(n) neu');
    ziel.appendChild(A.el('p', aenderung.join(' · '), { className: 'fin-summe' }));
    if (A.darf('stammdaten_bearbeiten')) ziel.appendChild(A.el('div', null, { className: 'fin-zeile' }, [A.knopf('Beitragsänderung übernehmen', function () {
      A.bestaetige('Beitragsänderung übernehmen', 'Die neuen Beträge gelten ab 01.01.' + r.jahr + ' für ' + r.konten.length + ' Konto/Konten. Die bisherigen Beträge bleiben für frühere Jahre erhalten.', 'Übernehmen').then(function (ja) {
        if (!ja) return;
        A.rufe('apiFinanzenBeitragsaenderungUebernehmen', r.jahr, e).then(function (a) {
          A.daten.uebernehme(a); infoVerwerfen();
          zustand.baErgebnis = a;
          fertig('Beitragsänderung ab ' + r.jahr + ' übernommen.');
        }, function () {});
      });
    })]));
    ziel.appendChild(baKonten(r));
  }

  /** Nach der Übernahme: Kennzahlen und Vorabinformation an die betroffenen Konten (Schreiben, je 500). */
  function baUebernommen(ziel, r) {
    ziel.appendChild(A.el('p', 'Beitragsänderung ab 01.01.' + r.jahr + ' ist übernommen.', { className: 'fin-ok' }));
    ziel.appendChild(baKacheln(r));
    var ids = r.konten.map(function (k) { return k.beitragskonto_id; });
    var knoepfe = [];
    if (A.darf('anschreiben_erstellen') && ids.length) {
      for (var i = 0; i < ids.length; i += 500) {
        (function (teil, nr) {
          var text = ids.length > 500 ? 'Vorabinformation Teil ' + nr + ' (' + teil.length + ')' : 'Vorabinformation erstellen';
          knoepfe.push(A.knopf(text, function () { A.zeige('korrespondenz', { anlass: 'Beitragsänderung', jahr: r.jahr, beitragskonto_ids: teil }); }));
        })(ids.slice(i, i + 500), i / 500 + 1);
      }
    }
    knoepfe.push(A.knopf('Weitere Änderung', function () { zustand.baErgebnis = null; A.neuZeichnen(); }, 'zweit'));
    ziel.appendChild(A.el('div', null, { className: 'fin-zeile' }, knoepfe));
    ziel.appendChild(baKonten(r));
  }
})();
</script>
