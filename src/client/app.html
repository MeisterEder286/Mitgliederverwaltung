<!--
  app – Browser-Logik der WebApp (eingebunden in client/index).

  Zweck:      Startdaten übernehmen, Kopfleiste/Navigation/Fußzeile füllen, Ansichten anzeigen und alle
              Server-Aufrufe über rufe() abwickeln. Phase 1: Ansichten „Start“ und „Messwerte“.
  Datenquelle: Startdaten (eingebettet oder über apiStart), danach nur über rufe('api…').
  Wer darf was: Die Navigation zeigt nur, was startdaten.aktionen erlaubt. Das ist reine Bequemlichkeit –
              erzwungen wird jede Berechtigung auf dem Server (A2). Nichts hier ist ein Sicherheitsmerkmal.
  Besonderheiten:
    - rufe(name, …args) ist der einzige Weg zum Server. Es misst die Zeit je Aufruf (performance.now)
      und merkt sich die letzten 200 Messungen. Beim Öffnen der Messwerte-Ansicht werden die noch nicht
      gemeldeten Client-Messungen gebündelt an apiClientMessungen geschickt (Auftragspunkt 8).
    - Antworten haben die Form { ok, daten, fehler, messung } (siehe docs/ENTWICKLUNG.md). Bei ok:false
      wird die Meldung angezeigt; bei fehler.art = 'konflikt' bekommt der Aufrufer den aktuellen
      Datensatz (fehler.aktuell) über die abgelehnte Promise (err.aktuell).
    - Alle Texte werden mit textContent gesetzt, nie mit innerHTML (kein Einschleusen von HTML).
-->
<script>
(function () {
  'use strict';

  var MAX_MESSUNGEN = 200;
  var messungen = [];      // { funktion, client_ms, server_ms, sheets, ok, zeit }
  var gemeldet = 0;        // so viele Einträge aus messungen wurden schon an den Server gemeldet
  var startBisBedienbar = null;
  var startdaten = null;
  var ansichten = {};
  var aktuelleAnsicht = null;

  // ------------------------------------------------------------------ Hilfsfunktionen DOM

  function $(id) { return document.getElementById(id); }

  /** Element mit Text erzeugen: el('td', 'Text', { className: 'zahl' }). */
  function el(tag, text, attrs) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = String(text);
    if (attrs) Object.keys(attrs).forEach(function (k) { e[k] = attrs[k]; });
    return e;
  }

  function leere(knoten) { while (knoten.firstChild) knoten.removeChild(knoten.firstChild); }

  function sichereUrl(url) {
    return typeof url === 'string' && /^https:\/\//i.test(url) ? url : null;
  }

  // ------------------------------------------------------------------ Meldungen

  function zeigeMeldung(text, art) {
    var m = $('meldung');
    leere(m);
    m.className = 'meldung' + (art === 'ok' ? ' ok' : '');
    m.appendChild(el('span', text));
    var zu = el('button', 'Schließen', { type: 'button', className: 'knopf zweit' });
    zu.addEventListener('click', function () { m.hidden = true; });
    m.appendChild(zu);
    m.hidden = false;
  }

  function zeigeFehler(fehler) {
    var text = (fehler && fehler.meldung) || 'Es ist ein Fehler aufgetreten.';
    if (fehler && fehler.nr) text += ' (Fehler-Nr. ' + fehler.nr + ')';
    zeigeMeldung(text, 'fehler');
  }

  // ------------------------------------------------------------------ Server-Aufrufe

  function merke(funktion, clientMs, antwort) {
    var m = antwort && antwort.messung ? antwort.messung : {};
    messungen.push({
      funktion: funktion,
      client_ms: Math.round(clientMs),
      server_ms: typeof m.server_ms === 'number' ? m.server_ms : null,
      sheets: typeof m.sheets === 'number' ? m.sheets : null,
      ok: !!(antwort && antwort.ok),
      zeit: new Date().toISOString()
    });
    if (messungen.length > MAX_MESSUNGEN) {
      var weg = messungen.length - MAX_MESSUNGEN;
      messungen.splice(0, weg);
      gemeldet = Math.max(0, gemeldet - weg);
    }
  }

  /**
   * Ruft eine öffentliche Server-Funktion auf. Liefert eine Promise mit antwort.daten.
   * Abgelehnt mit Error (err.art, err.nr, err.aktuell) bei ok:false oder Verbindungsfehler.
   */
  function rufe(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var t0 = performance.now();
      var runner = google.script.run
        .withSuccessHandler(function (antwort) {
          merke(name, performance.now() - t0, antwort);
          if (antwort && antwort.ok) { resolve(antwort.daten); return; }
          var f = (antwort && antwort.fehler) || { art: 'intern', meldung: 'Unerwartete Antwort vom Server.' };
          if (f.art === 'konflikt') {
            zeigeMeldung('Der Datensatz wurde inzwischen von jemand anderem geändert. Bitte die aktuelle Fassung prüfen.', 'fehler');
          } else {
            zeigeFehler(f);
          }
          var err = new Error(f.meldung || 'Fehler');
          err.art = f.art; err.nr = f.nr; err.aktuell = f.aktuell;
          reject(err);
        })
        .withFailureHandler(function (fehler) {
          merke(name, performance.now() - t0, null);
          zeigeFehler({ meldung: 'Keine Verbindung zum Server. Bitte erneut versuchen.' });
          var err = new Error('netz');
          err.art = 'netz';
          err.ursache = fehler;
          reject(err);
        });
      runner[name].apply(runner, args);
    });
  }

  /** Noch nicht gemeldete Client-Messungen gebündelt an den Server schicken. */
  function meldeMessungen() {
    var neu = messungen.slice(gemeldet);
    if (!neu.length) return Promise.resolve();
    var bis = messungen.length;
    return rufe('apiClientMessungen', neu).then(function () { gemeldet = bis; });
  }

  // ------------------------------------------------------------------ Gerüst

  function darf(aktion) {
    return !!(startdaten && startdaten.aktionen && startdaten.aktionen.indexOf(aktion) >= 0);
  }

  function fuelleGeruest() {
    $('beitragsjahr').textContent = startdaten.beitragsjahr ? '· Beitragsjahr ' + startdaten.beitragsjahr : '';
    var b = startdaten.benutzer || {};
    var benutzer = $('benutzer');
    leere(benutzer);
    benutzer.appendChild(el('span', b.name || b.email || ''));
    if (b.rollen && b.rollen.length) benutzer.appendChild(el('span', ' · ' + b.rollen.join(', ')));

    [['link-impressum', startdaten.impressum_url], ['link-datenschutz', startdaten.datenschutz_url]].forEach(function (p) {
      var url = sichereUrl(p[1]);
      var a = $(p[0]);
      if (url) { a.href = url; a.hidden = false; } else { a.hidden = true; }
    });

    var nav = $('navigation');
    leere(nav);
    Object.keys(ansichten).forEach(function (schluessel) {
      var a = ansichten[schluessel];
      if (a.aktion && !darf(a.aktion)) return;
      var knopf = el('button', a.titel, { type: 'button' });
      knopf.dataset.ansicht = schluessel;
      knopf.addEventListener('click', function () { zeige(schluessel); });
      nav.appendChild(knopf);
    });
  }

  function zeige(schluessel) {
    aktuelleAnsicht = schluessel;
    Array.prototype.forEach.call($('navigation').querySelectorAll('button'), function (k) {
      if (k.dataset.ansicht === schluessel) k.setAttribute('aria-current', 'page');
      else k.removeAttribute('aria-current');
    });
    var inhalt = $('inhalt');
    leere(inhalt);
    ansichten[schluessel].zeichne(inhalt);
    inhalt.focus();
  }

  // ------------------------------------------------------------------ Ansicht: Start

  ansichten.start = {
    titel: 'Start',
    aktion: null,
    zeichne: function (ziel) {
      var b = startdaten.benutzer || {};
      ziel.appendChild(el('h1', 'Willkommen' + (b.name ? ', ' + b.name : '')));
      var karte = el('div', null, { className: 'karte' });
      karte.appendChild(el('p', 'Angemeldet als ' + (b.email || '') + ' – Rolle: ' + ((b.rollen || []).join(', ') || '–')));
      karte.appendChild(el('p', 'Die Mitgliederliste folgt in einer späteren Ausbaustufe (Phase 3).', { className: 'leise' }));
      ziel.appendChild(karte);

      var abt = (startdaten.abteilungen || []).filter(function (a) { return a.aktiv !== false; });
      if (abt.length) {
        ziel.appendChild(el('h2', 'Abteilungen'));
        var ul = el('ul', null, { className: 'liste' });
        abt.forEach(function (a) { ul.appendChild(el('li', a.bezeichnung)); });
        ziel.appendChild(ul);
      }

      ziel.appendChild(el('h2', 'Verbindung'));
      var ergebnis = el('p', '', { className: 'leise' });
      var ping = el('button', 'Verbindung testen', { type: 'button', className: 'knopf zweit' });
      ping.addEventListener('click', function () {
        ping.disabled = true;
        var t0 = performance.now();
        rufe('apiPing').then(function () {
          ergebnis.textContent = 'Antwort nach ' + Math.round(performance.now() - t0) + ' ms.';
        }).catch(function () {}).then(function () { ping.disabled = false; });
      });
      ziel.appendChild(ping);
      ziel.appendChild(ergebnis);
    }
  };

  // ------------------------------------------------------------------ Ansicht: Messwerte

  function median(liste) { return quantil(liste, 0.5); }
  function quantil(liste, q) {
    var w = liste.filter(function (x) { return typeof x === 'number'; }).sort(function (a, b) { return a - b; });
    if (!w.length) return null;
    var i = Math.min(w.length - 1, Math.ceil(q * w.length) - 1);
    return w[Math.max(0, i)];
  }

  function tabelle(spalten, zeilen) {
    var rahmen = el('div', null, { className: 'tabelle-rahmen' });
    var t = el('table');
    var kopf = el('tr');
    spalten.forEach(function (s) { kopf.appendChild(el('th', s.titel, { className: s.zahl ? 'zahl' : '', scope: 'col' })); });
    var thead = el('thead'); thead.appendChild(kopf); t.appendChild(thead);
    var tbody = el('tbody');
    zeilen.forEach(function (z) {
      var tr = el('tr');
      spalten.forEach(function (s) {
        var v = z[s.feld];
        tr.appendChild(el('td', v === null || v === undefined ? '–' : v, { className: s.zahl ? 'zahl' : '' }));
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    rahmen.appendChild(t);
    return rahmen;
  }

  function clientAuswertung() {
    var je = {};
    messungen.forEach(function (m) { (je[m.funktion] = je[m.funktion] || []).push(m); });
    return Object.keys(je).sort().map(function (f) {
      var l = je[f];
      return {
        funktion: f,
        anzahl: l.length,
        client_median: median(l.map(function (m) { return m.client_ms; })),
        client_p90: quantil(l.map(function (m) { return m.client_ms; }), 0.9),
        server_median: median(l.map(function (m) { return m.server_ms; })),
        sheets_median: median(l.map(function (m) { return m.sheets; }))
      };
    });
  }

  /** Server-Auswertung (Messung.auswertung → Statistik.auswerten): je Funktion Kennzahlen {median, p90, anzahl}. */
  function serverTabelle(liste) {
    if (!Array.isArray(liste) || !liste.length) return el('p', 'Noch keine Server-Messwerte vorhanden.', { className: 'leise' });
    var k = function (z, feld, wert) { return z[feld] && z[feld][wert] !== null && z[feld][wert] !== undefined ? z[feld][wert] : null; };
    var zeilen = liste.map(function (z) {
      return {
        funktion: z.funktion, anzahl: z.anzahl, fehler: z.fehler,
        server_median: k(z, 'server_ms', 'median'), server_p90: k(z, 'server_ms', 'p90'),
        sheets_median: k(z, 'sheets', 'median'), client_median: k(z, 'client_ms', 'median')
      };
    });
    return tabelle([
      { feld: 'funktion', titel: 'Funktion' },
      { feld: 'anzahl', titel: 'Anzahl', zahl: true },
      { feld: 'fehler', titel: 'Fehler', zahl: true },
      { feld: 'server_median', titel: 'Server ms (Median)', zahl: true },
      { feld: 'server_p90', titel: 'Server ms (P90)', zahl: true },
      { feld: 'sheets_median', titel: 'Sheets-Aufrufe', zahl: true },
      { feld: 'client_median', titel: 'Client ms (Median)', zahl: true }
    ], zeilen);
  }

  ansichten.messwerte = {
    titel: 'Messwerte',
    aktion: 'messung_lesen',
    zeichne: function (ziel) {
      ziel.appendChild(el('h1', 'Messwerte'));
      ziel.appendChild(el('p', 'Start bis bedienbar (diese Sitzung): ' +
        (startBisBedienbar === null ? '–' : startBisBedienbar + ' ms'), { className: 'karte' }));

      ziel.appendChild(el('h2', 'Dieser Browser'));
      ziel.appendChild(tabelle([
        { feld: 'funktion', titel: 'Funktion' },
        { feld: 'anzahl', titel: 'Anzahl', zahl: true },
        { feld: 'client_median', titel: 'Client ms (Median)', zahl: true },
        { feld: 'client_p90', titel: 'Client ms (P90)', zahl: true },
        { feld: 'server_median', titel: 'Server ms (Median)', zahl: true },
        { feld: 'sheets_median', titel: 'Sheets-Aufrufe', zahl: true }
      ], clientAuswertung()));
      ziel.appendChild(el('p', 'Differenz Client − Server ≈ Übertragung und Aufruf-Overhead von google.script.run.', { className: 'leise' }));

      ziel.appendChild(el('h2', 'Server (alle Benutzer)'));
      var bereich = el('div', null);
      bereich.appendChild(el('p', 'Lädt …', { className: 'laedt' }));
      ziel.appendChild(bereich);

      meldeMessungen().catch(function () {}).then(function () {
        return rufe('apiMessungen');
      }).then(function (daten) {
        if (aktuelleAnsicht !== 'messwerte') return;
        leere(bereich);
        bereich.appendChild(serverTabelle(daten));
      }).catch(function () {
        leere(bereich);
        bereich.appendChild(el('p', 'Server-Messwerte konnten nicht geladen werden.', { className: 'leise' }));
      });
    }
  };

  // ------------------------------------------------------------------ Start

  function lesestartdaten() {
    var block = $('startdaten');
    var text = block ? block.textContent.trim() : '';
    if (text) {
      try { return Promise.resolve(JSON.parse(text)); } catch (e) { /* weiter mit apiStart */ }
    }
    return rufe('apiStart');
  }

  lesestartdaten().then(function (daten) {
    startdaten = daten || {};
    fuelleGeruest();
    zeige('start');
    // performance.now() zählt ab dem Laden des (inneren) Dokuments; die äußere Apps-Script-Hülle
    // davor ist nicht enthalten.
    startBisBedienbar = Math.round(performance.now());
  }).catch(function () {
    var laedt = $('laedt');
    if (laedt) laedt.textContent = 'Die Startdaten konnten nicht geladen werden. Bitte Seite neu laden.';
  });
})();
</script>
