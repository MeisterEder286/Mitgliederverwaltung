<!--
  stil – Gestaltung der WebApp (eingebunden in client/index und client/kein_zugang).

  Zweck:      Mobile-first (ab 360 px Breite), gut lesbar, barrierearm: Kontrast mind. 4,5:1, sichtbarer
              Tastaturfokus, große Bedienflächen (mind. 44 px), keine reinen Farbsignale.
  Datenquelle: keine.
  Wer darf:   –
  Besonderheiten: Nur Systemschriften, keine externen Ressourcen (B8). Farben als Variablen oben gesammelt.
-->
<style>
  :root {
    --grund: #ffffff;
    --flaeche: #f3f5f8;
    --text: #1b1f24;
    --text-leise: #4a5560;
    --akzent: #0b4f8a;
    --akzent-text: #ffffff;
    --rand: #c9d1da;
    --fehler-grund: #fdecec;
    --fehler-text: #8a1111;
    --ok-grund: #e8f5ec;
    --ok-text: #135c2c;
    --fokus: #f2a900;
    --radius: 6px;
    --abstand: 16px;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--grund);
    line-height: 1.45;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--akzent); }
  :focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; }

  .sprungmarke { position: absolute; left: -9999px; }
  .sprungmarke:focus { left: var(--abstand); top: 8px; background: var(--grund); padding: 8px; z-index: 10; }

  .kopf {
    background: var(--akzent);
    color: var(--akzent-text);
    padding: 12px var(--abstand);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: baseline;
  }
  .kopf-titel { display: flex; flex-direction: column; }
  .verein { font-size: 0.85rem; opacity: 0.9; }
  .app { font-size: 1.15rem; font-weight: 600; }
  .jahr { font-weight: 400; font-size: 0.9rem; }
  .kopf-benutzer { font-size: 0.85rem; }

  .navigation {
    display: flex;
    gap: 4px;
    padding: 8px var(--abstand);
    background: var(--flaeche);
    border-bottom: 1px solid var(--rand);
    overflow-x: auto;
  }
  .navigation button {
    min-height: 44px;
    padding: 8px 14px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .navigation button[aria-current="page"] { background: var(--grund); border-color: var(--rand); font-weight: 600; }

  .inhalt { flex: 1; padding: var(--abstand); max-width: 1100px; width: 100%; margin: 0 auto; }
  .inhalt:focus { outline: none; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  .leise { color: var(--text-leise); font-size: 0.9rem; }
  .laedt { color: var(--text-leise); }

  .meldung { margin: 8px var(--abstand) 0; padding: 12px; border-radius: var(--radius); background: var(--fehler-grund); color: var(--fehler-text); }
  .meldung.ok { background: var(--ok-grund); color: var(--ok-text); }
  .meldung button { margin-left: 8px; }

  .knopf {
    min-height: 44px;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--akzent);
    background: var(--akzent);
    color: var(--akzent-text);
    font: inherit;
    cursor: pointer;
  }
  .knopf.zweit { background: var(--grund); color: var(--akzent); }
  .knopf:disabled { opacity: 0.6; cursor: default; }

  .karte { border: 1px solid var(--rand); border-radius: var(--radius); padding: 12px; margin: 0 0 12px; background: var(--grund); }
  .liste { list-style: none; padding: 0; margin: 0; }
  .liste li { padding: 6px 0; border-bottom: 1px solid var(--flaeche); }

  .tabelle-rahmen { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rand); white-space: nowrap; }
  th { background: var(--flaeche); font-weight: 600; }
  td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; }

  .fuss {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 12px var(--abstand);
    font-size: 0.85rem;
    border-top: 1px solid var(--rand);
    background: var(--flaeche);
    color: var(--text-leise);
  }
  .fuss a { min-height: 44px; display: inline-flex; align-items: center; }
  .fuss-verein { margin-left: auto; display: inline-flex; align-items: center; }

  /* ---- Bausteine aus client/kern ---- */
  .knopf.klein { min-height: 36px; padding: 4px 10px; font-size: 0.9rem; }
  .knopf.gefahr { background: var(--fehler-text); border-color: var(--fehler-text); color: #fff; }
  .knopfleiste { display: flex; flex-wrap: wrap; gap: 8px; }
  .abschnittskopf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 20px 0 8px; }
  .abschnittskopf h1, .abschnittskopf h2 { margin: 0; }
  .meldung.hinweis { background: #fff6dc; color: #5c4400; }
  .tabelle-info { margin: 6px 0; }
  tr.klickbar { cursor: pointer; }
  tr.klickbar:hover td, tr.klickbar:focus td { background: #eef4fb; }
  .sortierknopf { background: none; border: 0; font: inherit; font-weight: 600; cursor: pointer; padding: 0; color: inherit; }
  .filterleiste { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .filterleiste .suche { flex: 1 1 220px; }
  .filterleiste input, .filterleiste select, .formular input, .formular select, .formular textarea {
    min-height: 44px; padding: 8px 10px; border: 1px solid var(--rand); border-radius: var(--radius); font: inherit; background: var(--grund); color: var(--text); width: 100%;
  }
  .filterleiste select { width: auto; max-width: 100%; }
  .formular { display: grid; grid-template-columns: 1fr; gap: 10px 16px; margin: 0 0 12px; }
  .feldgruppe { grid-column: 1 / -1; font-size: 1rem; margin: 12px 0 0; padding-top: 8px; border-top: 1px solid var(--rand); }
  .feld { display: flex; flex-direction: column; gap: 4px; }
  .feld label { font-weight: 600; font-size: 0.9rem; }
  .feld .hilfe { font-size: 0.8rem; }
  .feldfehler { color: var(--fehler-text); font-size: 0.85rem; min-height: 0; }
  [aria-invalid="true"] { border-color: var(--fehler-text) !important; }
  .details { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 4px 12px; margin: 0 0 12px; }
  .details dt { color: var(--text-leise); font-size: 0.9rem; }
  .details dd { margin: 0; overflow-wrap: anywhere; }
  .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 0 0 12px; }
  .kachel { display: flex; flex-direction: column; gap: 2px; padding: 12px; border: 1px solid var(--rand); border-radius: var(--radius); background: var(--grund); text-align: left; font: inherit; color: inherit; }
  button.kachel { cursor: pointer; }
  .kachel-zahl { font-size: clamp(1.1rem, 5.2vw, 1.5rem); white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kachel-text { font-size: 0.85rem; color: var(--text-leise); }
  .kachel.warnung { border-color: #d39b00; background: #fffaeb; }
  .kachel.fehler { border-color: var(--fehler-text); background: var(--fehler-grund); }
  .ampel { white-space: nowrap; font-weight: 600; }
  .ampel.gruen { color: #135c2c; } .ampel.gelb { color: #7a5600; } .ampel.rot { color: var(--fehler-text); } .ampel.grau { color: var(--text-leise); }
  .marke { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.8rem; background: var(--flaeche); border: 1px solid var(--rand); margin: 0 4px 2px 0; }
  .dialog { border: 1px solid var(--rand); border-radius: var(--radius); padding: var(--abstand); max-width: min(640px, calc(100vw - 24px)); width: 100%; }
  /* Lange Dialoge scrollen innen; die Knopfleiste bleibt unten sichtbar */
  .dialog { max-height: calc(100dvh - 24px); overflow-y: auto; }
  .dialog > .knopfleiste { position: sticky; bottom: calc(-1 * var(--abstand)); background: var(--grund); padding: 10px 0 var(--abstand); margin-top: 8px; border-top: 1px solid var(--rand); }
  input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--akzent); }
  .dialog::backdrop { background: rgba(0,0,0,0.4); }
  /* Reiter: eine Zeile, auf dem Handy waagrecht wischbar (statt mehrzeilig umzubrechen) */
  .reiter { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-bottom: 1px solid var(--rand); margin: 0 0 12px; }
  .reiter button { min-height: 44px; white-space: nowrap; flex: 0 0 auto; padding: 6px 12px; border: 1px solid transparent; border-bottom: 0; background: none; font: inherit; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; }
  .reiter button[aria-selected="true"] { font-weight: 600; color: var(--akzent); box-shadow: inset 0 -3px 0 var(--akzent); }
  @media print { .kopf, .navigation, .fuss, .knopfleiste, .filterleiste, .meldung { display: none !important; } }

  @media (min-width: 720px) {
    .formular { grid-template-columns: 1fr 1fr; }
    .feld.breit { grid-column: 1 / -1; }
    .kopf { align-items: center; }
    h1 { font-size: 1.5rem; }
  }
</style>
